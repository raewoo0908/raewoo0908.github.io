<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
  <defs>
    <marker id="tA" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">📦 tuple vs list — where the pointer array lives</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">Immutable means the size never changes, so a tuple can hold the array inline</text>

  <!-- list -->
  <rect x="30" y="78" width="440" height="196" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="52" y="102" font-size="13.5" font-weight="700" fill="#1d4ed8">list — indirect (two allocations)</text>

  <rect x="52" y="116" width="150" height="112" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="127" y="134" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">PyListObject</text>
  <rect x="62" y="140" width="130" height="18" fill="#ffffff"/>
  <text x="68" y="153" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">refcnt · type</text>
  <rect x="62" y="160" width="130" height="18" fill="#ffffff"/>
  <text x="68" y="173" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">ob_size</text>
  <rect x="62" y="180" width="130" height="20" fill="#bfdbfe"/>
  <text x="68" y="194" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#1e3a8a">ob_item ●———→</text>
  <rect x="62" y="202" width="130" height="18" fill="#ffffff"/>
  <text x="68" y="215" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">allocated</text>

  <line x1="196" y1="190" x2="240" y2="172" stroke="#64748b" stroke-width="1.8" marker-end="url(#tA)"/>

  <rect x="248" y="148" width="44" height="34" fill="#93c5fd" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="270" cy="165" r="4" fill="#1e3a8a"/>
  <rect x="292" y="148" width="44" height="34" fill="#93c5fd" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="314" cy="165" r="4" fill="#1e3a8a"/>
  <rect x="336" y="148" width="44" height="34" fill="#93c5fd" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="358" cy="165" r="4" fill="#1e3a8a"/>
  <rect x="380" y="148" width="44" height="34" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="402" y="169" text-anchor="middle" font-size="9" fill="#93c5fd">spare</text>
  <text x="336" y="200" text-anchor="middle" font-size="10" fill="#2563eb">a separate block elsewhere on the heap</text>

  <rect x="52" y="238" width="396" height="26" rx="7" fill="#dbeafe"/>
  <text x="66" y="256" font-size="11.5" fill="#1e3a8a">It must be resizable, so it needs its own <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">realloc</tspan>-able block</text>

  <!-- tuple -->
  <rect x="490" y="78" width="440" height="196" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="512" y="102" font-size="13.5" font-weight="700" fill="#7e22ce">tuple — inline (one allocation)</text>

  <rect x="512" y="116" width="300" height="112" rx="8" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="662" y="134" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b21a8">PyTupleObject — one block</text>
  <rect x="522" y="140" width="130" height="18" fill="#ffffff"/>
  <text x="528" y="153" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b21a8">refcnt · type</text>
  <rect x="522" y="160" width="130" height="18" fill="#ffffff"/>
  <text x="528" y="173" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b21a8">ob_size = 3</text>

  <text x="732" y="153" text-anchor="middle" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#6b21a8">ob_item[ ]</text>
  <rect x="662" y="160" width="46" height="34" fill="#c084fc" stroke="#9333ea" stroke-width="1"/>
  <circle cx="685" cy="177" r="4" fill="#581c87"/>
  <rect x="708" y="160" width="46" height="34" fill="#c084fc" stroke="#9333ea" stroke-width="1"/>
  <circle cx="731" cy="177" r="4" fill="#581c87"/>
  <rect x="754" y="160" width="46" height="34" fill="#c084fc" stroke="#9333ea" stroke-width="1"/>
  <circle cx="777" cy="177" r="4" fill="#581c87"/>
  <text x="662" y="214" text-anchor="middle" font-size="10" fill="#9333ea">the array follows the struct directly</text>

  <rect x="512" y="238" width="396" height="26" rx="7" fill="#f3e8ff"/>
  <text x="526" y="256" font-size="11.5" fill="#6b21a8">One <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">malloc</tspan> and done — smaller and faster</text>

  <!-- measured -->
  <rect x="30" y="290" width="440" height="94" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="312" font-size="12.5" font-weight="700" fill="#334155">Measured (same number of items)</text>
  <line x1="52" y1="320" x2="448" y2="320" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="340" font-size="11" fill="#64748b">n</text>
  <text x="230" y="340" text-anchor="end" font-size="11" font-weight="700" fill="#1d4ed8">list</text>
  <text x="380" y="340" text-anchor="end" font-size="11" font-weight="700" fill="#7e22ce">tuple</text>
  <text x="70" y="360" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#475569">0</text>
  <text x="230" y="360" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1d4ed8">56 B</text>
  <text x="380" y="360" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7e22ce">40 B</text>
  <text x="70" y="377" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#475569">10</text>
  <text x="230" y="377" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1d4ed8">136 B</text>
  <text x="380" y="377" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7e22ce">120 B</text>

  <!-- trap -->
  <rect x="490" y="290" width="440" height="94" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="512" y="312" font-size="12.5" font-weight="700" fill="#b91c1c">⚠️ "Immutable" only covers the pointer array</text>
  <text x="512" y="333" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7f1d1d">t = ([1, 2], 3)</text>
  <text x="512" y="351" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7f1d1d">t[0].append(99)   →  ([1, 2, 99], 3)</text>
  <text x="512" y="373" font-size="11" fill="#b91c1c">If a pointed-to object is mutable, it can still change</text>
</svg>

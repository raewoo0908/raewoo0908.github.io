<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">Every object starts with the same header</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">a shared 16-byte header + a per-type body = an object on the heap</text>

  <!-- ================= left: the shared header ================= -->
  <rect x="30" y="80" width="250" height="332" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="155" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">shared by every object</text>

  <rect x="50" y="120" width="210" height="30" rx="6" fill="#dcfce7"/>
  <text x="62" y="140" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">ob_refcnt</text>
  <text x="248" y="140" text-anchor="end" font-size="11" fill="#15803d">8 B</text>

  <rect x="50" y="154" width="210" height="30" rx="6" fill="#dcfce7"/>
  <text x="62" y="174" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">ob_type</text>
  <text x="248" y="174" text-anchor="end" font-size="11" fill="#15803d">8 B</text>

  <rect x="50" y="192" width="210" height="34" rx="6" fill="#bbf7d0"/>
  <text x="155" y="215" text-anchor="middle" font-size="15" font-weight="800" fill="#14532d">= 16 bytes</text>

  <text x="50" y="252" font-size="11.5" fill="#166534">· hits zero → freed immediately</text>
  <text x="50" y="272" font-size="11.5" fill="#166534">· the object carries its own type</text>
  <text x="62" y="291" font-size="11.5" fill="#15803d">→ type(x) · isinstance · duck typing</text>

  <rect x="50" y="308" width="210" height="82" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="155" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">PyVarObject</text>
  <text x="155" y="351" text-anchor="middle" font-size="11.5" fill="#166534">adds an 8 B ob_size on top</text>
  <text x="155" y="371" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15803d">list · tuple · bytes</text>

  <text x="296" y="252" text-anchor="middle" font-size="24" font-weight="800" fill="#94a3b8">+</text>

  <!-- ================= right: per-type bodies ================= -->
  <!-- int -->
  <rect x="312" y="80" width="292" height="100" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="328" y="104" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1d4ed8">int</text>
  <rect x="516" y="90" width="76" height="20" rx="10" fill="#dbeafe"/>
  <text x="554" y="104" text-anchor="middle" font-size="10.5" fill="#1e3a8a">0 → 28 B</text>
  <text x="328" y="130" font-size="11.5" fill="#334155">lv_tag + an array of 30-bit digits</text>
  <text x="328" y="152" font-size="11.5" fill="#334155">no upper bound, and -5 … 256 are baked</text>
  <text x="328" y="169" font-size="11.5" fill="#334155">into the interpreter and shared</text>

  <!-- str -->
  <rect x="636" y="80" width="292" height="100" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="652" y="104" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1d4ed8">str</text>
  <rect x="828" y="90" width="88" height="20" rx="10" fill="#dbeafe"/>
  <text x="872" y="104" text-anchor="middle" font-size="10.5" fill="#1e3a8a">'a' → 42 B</text>
  <text x="652" y="130" font-size="11.5" fill="#334155">struct and characters in one allocation</text>
  <text x="652" y="152" font-size="11.5" fill="#334155">1 · 2 · 4 B per character, and only</text>
  <text x="652" y="169" font-size="11.5" fill="#334155">identifier-shaped ASCII gets interned</text>

  <!-- list -->
  <rect x="312" y="192" width="292" height="100" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="328" y="216" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1d4ed8">list</text>
  <rect x="516" y="202" width="76" height="20" rx="10" fill="#dbeafe"/>
  <text x="554" y="216" text-anchor="middle" font-size="10.5" fill="#1e3a8a">[] → 56 B</text>
  <text x="328" y="242" font-size="11.5" fill="#334155">ob_item → a pointer array stored apart</text>
  <text x="328" y="264" font-size="11.5" fill="#334155">pointers are contiguous, not values.</text>
  <text x="328" y="281" font-size="11.5" fill="#334155">9/8× over-allocation → amortized O(1)</text>

  <!-- tuple -->
  <rect x="636" y="192" width="292" height="100" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="652" y="216" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1d4ed8">tuple</text>
  <rect x="840" y="202" width="76" height="20" rx="10" fill="#dbeafe"/>
  <text x="878" y="216" text-anchor="middle" font-size="10.5" fill="#1e3a8a">() → 40 B</text>
  <text x="652" y="242" font-size="11.5" fill="#334155">the pointer array sits inline, behind</text>
  <text x="652" y="264" font-size="11.5" fill="#334155">the struct — one allocation, and small</text>
  <text x="652" y="281" font-size="11.5" fill="#334155">tuples come back from a freelist</text>

  <!-- dict -->
  <rect x="312" y="304" width="292" height="100" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="328" y="328" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1d4ed8">dict · set</text>
  <rect x="516" y="314" width="76" height="20" rx="10" fill="#dbeafe"/>
  <text x="554" y="328" text-anchor="middle" font-size="10.5" fill="#1e3a8a">{} → 64 B</text>
  <text x="328" y="354" font-size="11.5" fill="#334155">a sparse index array + a dense entry array</text>
  <text x="328" y="376" font-size="11.5" fill="#334155">insertion order is a free side effect</text>
  <text x="328" y="393" font-size="11.5" fill="#334155">of that shape</text>

  <!-- instance -->
  <rect x="636" y="304" width="292" height="100" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="652" y="328" font-size="14" font-weight="700" fill="#1d4ed8">class instance</text>
  <rect x="824" y="314" width="92" height="20" rx="10" fill="#dbeafe"/>
  <text x="870" y="328" text-anchor="middle" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">__slots__</text>
  <text x="652" y="354" font-size="11.5" fill="#334155">an attribute dict by default → anything goes</text>
  <text x="652" y="376" font-size="11.5" fill="#334155">__slots__ puts fixed slots in the struct</text>
  <text x="652" y="393" font-size="11.5" fill="#334155">100k instances: 9.16 → 5.34 MiB</text>

  <!-- ================= bottom summary ================= -->
  <rect x="30" y="430" width="898" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="479" y="456" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">C measures values, Python measures objects — which is why the integer <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</tspan> costs 28 bytes, not 4</text>
</svg>

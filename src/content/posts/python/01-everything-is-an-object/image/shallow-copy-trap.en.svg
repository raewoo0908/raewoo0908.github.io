<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 438" width="960" height="438" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="438" fill="#ffffff"/>
  <defs>
    <marker id="scA" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
    <marker id="scG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
    <marker id="scR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">✂️ Shallow copy — the only new thing is the pointer array</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">You get two list objects, but they still point at the very same inner objects</text>

  <!-- (1) right after the copy -->
  <rect x="30" y="78" width="440" height="214" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="52" y="104" font-size="13.5" font-weight="700" fill="#1d4ed8">① Right after <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">copy = orig[:]</tspan></text>
  <text x="52" y="124" font-size="11" fill="#2563eb">A new pointer array is allocated; the pointers inside are copied as-is</text>

  <text x="95" y="152" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">orig</text>
  <rect x="52" y="160" width="86" height="30" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="95" y1="160" x2="95" y2="190" stroke="#bfdbfe" stroke-width="1"/>
  <circle cx="74" cy="175" r="4" fill="#1e3a8a"/><circle cx="116" cy="175" r="4" fill="#1e3a8a"/>

  <text x="95" y="232" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">copy</text>
  <rect x="52" y="240" width="86" height="30" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="95" y1="240" x2="95" y2="270" stroke="#bfdbfe" stroke-width="1"/>
  <circle cx="74" cy="255" r="4" fill="#1e3a8a"/><circle cx="116" cy="255" r="4" fill="#1e3a8a"/>

  <line x1="78" y1="175" x2="272" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#scA)"/>
  <line x1="118" y1="179" x2="272" y2="232" stroke="#64748b" stroke-width="1.5" marker-end="url(#scA)"/>
  <line x1="78" y1="252" x2="272" y2="185" stroke="#64748b" stroke-width="1.5" marker-end="url(#scA)"/>
  <line x1="118" y1="252" x2="272" y2="243" stroke="#64748b" stroke-width="1.5" marker-end="url(#scA)"/>

  <rect x="280" y="158" width="150" height="34" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="355" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">[1, 2]</text>
  <rect x="280" y="222" width="150" height="34" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="355" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">[3, 4]</text>

  <text x="250" y="282" text-anchor="middle" font-size="11" fill="#1d4ed8">Two list objects now — but still only two inner objects</text>

  <!-- (2) after mutating the original -->
  <rect x="490" y="78" width="440" height="214" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="512" y="104" font-size="13.5" font-weight="700" fill="#b91c1c">② After <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">orig[0].append(99)</tspan></text>
  <text x="512" y="124" font-size="11" fill="#dc2626">One shared object changed. copy did not do anything at all.</text>

  <text x="555" y="152" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">orig</text>
  <rect x="512" y="160" width="86" height="30" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
  <line x1="555" y1="160" x2="555" y2="190" stroke="#fecaca" stroke-width="1"/>
  <circle cx="534" cy="175" r="4" fill="#dc2626"/><circle cx="576" cy="175" r="4" fill="#dc2626"/>

  <text x="555" y="232" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">copy</text>
  <rect x="512" y="240" width="86" height="30" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
  <line x1="555" y1="240" x2="555" y2="270" stroke="#fecaca" stroke-width="1"/>
  <circle cx="534" cy="255" r="4" fill="#dc2626"/><circle cx="576" cy="255" r="4" fill="#dc2626"/>

  <line x1="538" y1="175" x2="732" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#scA)"/>
  <line x1="578" y1="179" x2="732" y2="232" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#scG)"/>
  <line x1="538" y1="252" x2="732" y2="185" stroke="#dc2626" stroke-width="1.8" marker-end="url(#scR)"/>
  <line x1="578" y1="252" x2="732" y2="243" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#scG)"/>

  <text x="815" y="150" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">only this object changed</text>
  <rect x="740" y="158" width="150" height="34" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="815" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">[1, 2, <tspan font-weight="800" fill="#dc2626">99</tspan>]</text>
  <rect x="740" y="222" width="150" height="34" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="815" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">[3, 4]</text>

  <text x="710" y="282" text-anchor="middle" font-size="11" fill="#b91c1c">copy was never touched, yet it changed too</text>

  <!-- what the code is telling you -->
  <rect x="30" y="304" width="900" height="118" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="326" font-size="12.5" font-weight="700" fill="#334155">What the code is telling you</text>

  <text x="52" y="354" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#475569">copy is orig</text>
  <text x="250" y="354" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#15803d">False</text>
  <text x="424" y="354" font-size="11.5" fill="#475569">The pointer array (the box) really is brand new</text>

  <text x="52" y="380" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#475569">copy[0] is orig[0]</text>
  <text x="250" y="380" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#dc2626">True</text>
  <text x="424" y="380" font-size="11.5" fill="#475569">But the objects those pointers point at are the originals</text>

  <text x="52" y="406" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#475569">print(copy)</text>
  <text x="250" y="406" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#dc2626">[[1, 2, 99], [3, 4]]</text>
  <text x="424" y="406" font-size="11.5" fill="#475569">So a mutation made through orig shows up in copy</text>
</svg>

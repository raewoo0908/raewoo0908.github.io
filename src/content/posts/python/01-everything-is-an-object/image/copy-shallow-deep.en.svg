<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="410" fill="#ffffff"/>
  <defs>
    <marker id="cA" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
    <marker id="cR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">📑 Shallow vs deep copy — copy the pointers, or the targets?</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">Containers hold pointers, so there have to be two kinds of copy</text>

  <!-- shallow -->
  <rect x="30" y="78" width="440" height="228" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="52" y="102" font-size="13.5" font-weight="700" fill="#b91c1c">Shallow — only the pointer array is new</text>
  <rect x="52" y="112" width="396" height="24" rx="5" fill="#fee2e2"/>
  <text x="62" y="129" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7f1d1d">orig[:]  ·  list(orig)  ·  copy.copy(orig)</text>

  <text x="105" y="160" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">orig</text>
  <rect x="62" y="168" width="86" height="30" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
  <circle cx="90" cy="183" r="4" fill="#dc2626"/><circle cx="120" cy="183" r="4" fill="#dc2626"/>

  <text x="105" y="232" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">shallow</text>
  <rect x="62" y="240" width="86" height="30" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
  <circle cx="90" cy="255" r="4" fill="#dc2626"/><circle cx="120" cy="255" r="4" fill="#dc2626"/>
  <text x="105" y="288" text-anchor="middle" font-size="10" fill="#b91c1c">new array</text>

  <line x1="90" y1="187" x2="270" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#cA)"/>
  <line x1="120" y1="187" x2="270" y2="244" stroke="#64748b" stroke-width="1.5" marker-end="url(#cA)"/>
  <line x1="90" y1="251" x2="270" y2="204" stroke="#dc2626" stroke-width="1.5" marker-end="url(#cR)"/>
  <line x1="120" y1="251" x2="270" y2="252" stroke="#dc2626" stroke-width="1.5" marker-end="url(#cR)"/>

  <rect x="278" y="184" width="150" height="34" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="353" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">[1, 2]</text>
  <rect x="278" y="232" width="150" height="34" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="353" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">[3, 4]</text>
  <text x="353" y="286" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">the inner objects are shared</text>

  <!-- deep -->
  <rect x="490" y="78" width="440" height="228" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="512" y="102" font-size="13.5" font-weight="700" fill="#15803d">Deep — recursively copies the targets too</text>
  <rect x="512" y="112" width="396" height="24" rx="5" fill="#dcfce7"/>
  <text x="522" y="129" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#14532d">copy.deepcopy(orig)</text>

  <text x="565" y="160" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">orig</text>
  <rect x="522" y="168" width="86" height="30" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="550" cy="183" r="4" fill="#16a34a"/><circle cx="580" cy="183" r="4" fill="#16a34a"/>

  <text x="565" y="232" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">deep</text>
  <rect x="522" y="240" width="86" height="30" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="550" cy="255" r="4" fill="#16a34a"/><circle cx="580" cy="255" r="4" fill="#16a34a"/>

  <line x1="550" y1="187" x2="700" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#cA)"/>
  <line x1="580" y1="187" x2="700" y2="206" stroke="#64748b" stroke-width="1.5" marker-end="url(#cA)"/>
  <line x1="550" y1="251" x2="700" y2="242" stroke="#16a34a" stroke-width="1.5" marker-end="url(#cA)"/>
  <line x1="580" y1="251" x2="700" y2="268" stroke="#16a34a" stroke-width="1.5" marker-end="url(#cA)"/>

  <rect x="708" y="164" width="130" height="28" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.3"/>
  <text x="773" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">[1, 2]</text>
  <rect x="708" y="196" width="130" height="28" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.3"/>
  <text x="773" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">[3, 4]</text>
  <rect x="708" y="228" width="130" height="28" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.8"/>
  <text x="773" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">copy of [1, 2]</text>
  <rect x="708" y="260" width="130" height="28" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.8"/>
  <text x="773" y="279" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">copy of [3, 4]</text>
  <text x="874" y="228" font-size="10.5" font-weight="700" fill="#15803d">fully</text>
  <text x="874" y="243" font-size="10.5" font-weight="700" fill="#15803d">independent</text>

  <!-- result -->
  <rect x="30" y="322" width="900" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="344" font-size="12.5" font-weight="700" fill="#334155">After running <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">orig[0].append(99)</tspan></text>
  <text x="52" y="368" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7f1d1d">orig    → [[1, 2, 99], [3, 4]]        shallow → [[1, 2, 99], [3, 4]]   ← changed too</text>
  <text x="52" y="386" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#14532d">deep    → [[1, 2], [3, 4]]            ← unaffected</text>
</svg>

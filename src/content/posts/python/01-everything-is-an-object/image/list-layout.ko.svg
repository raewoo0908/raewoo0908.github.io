<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <defs>
    <marker id="lA" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">📋 list — 연속으로 놓이는 건 값이 아니라 포인터입니다</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">C 프로그래머가 가장 크게 오해하는 지점입니다</text>

  <!-- C 배열 -->
  <rect x="30" y="78" width="330" height="196" rx="12" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1"/>
  <text x="52" y="102" font-size="13.5" font-weight="700" fill="#a16207">C — <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">int arr[3]</tspan></text>
  <text x="52" y="122" font-size="11" fill="#a16207">값이 연속 메모리에 그대로 놓입니다</text>

  <rect x="52" y="136" width="90" height="46" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="97" y="165" text-anchor="middle" font-size="17" font-weight="800" fill="#78350f">1</text>
  <rect x="142" y="136" width="90" height="46" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="187" y="165" text-anchor="middle" font-size="17" font-weight="800" fill="#78350f">2</text>
  <rect x="232" y="136" width="90" height="46" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="277" y="165" text-anchor="middle" font-size="17" font-weight="800" fill="#78350f">3</text>
  <text x="187" y="200" text-anchor="middle" font-size="11" fill="#a16207">총 12바이트 · 캐시 지역성 최고</text>

  <rect x="52" y="216" width="270" height="44" rx="8" fill="#fef3c7"/>
  <text x="66" y="234" font-size="11" fill="#78350f">✓ 값 하나 읽는 데 메모리 접근 1회</text>
  <text x="66" y="251" font-size="11" fill="#78350f">✗ 타입이 하나로 고정</text>

  <!-- Python list -->
  <rect x="380" y="78" width="550" height="196" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="402" y="102" font-size="13.5" font-weight="700" fill="#1d4ed8">Python — <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">[1, 2, 3]</tspan></text>
  <text x="402" y="122" font-size="11" fill="#1d4ed8">포인터가 연속으로 놓이고, 실제 객체는 힙에 흩어집니다</text>

  <!-- PyListObject -->
  <rect x="402" y="134" width="146" height="118" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="475" y="152" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">PyListObject</text>
  <rect x="412" y="158" width="126" height="18" fill="#ffffff"/>
  <text x="418" y="171" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">ob_refcnt · ob_type</text>
  <rect x="412" y="178" width="126" height="18" fill="#ffffff"/>
  <text x="418" y="191" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">ob_size = 3</text>
  <rect x="412" y="198" width="126" height="20" fill="#bfdbfe"/>
  <text x="418" y="212" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#1e3a8a">ob_item ●</text>
  <rect x="412" y="220" width="126" height="18" fill="#ffffff"/>
  <text x="418" y="233" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">allocated = 4</text>
  <text x="475" y="248" text-anchor="middle" font-size="9.5" fill="#2563eb">56 B</text>

  <line x1="540" y1="208" x2="576" y2="180" stroke="#64748b" stroke-width="1.8" marker-end="url(#lA)"/>

  <!-- 포인터 배열 -->
  <text x="642" y="146" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">PyObject * 배열</text>
  <rect x="584" y="152" width="42" height="34" fill="#93c5fd" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="605" cy="169" r="4" fill="#1e3a8a"/>
  <rect x="626" y="152" width="42" height="34" fill="#93c5fd" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="647" cy="169" r="4" fill="#1e3a8a"/>
  <rect x="668" y="152" width="42" height="34" fill="#93c5fd" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="689" cy="169" r="4" fill="#1e3a8a"/>
  <rect x="710" y="152" width="42" height="34" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="731" y="173" text-anchor="middle" font-size="9" fill="#93c5fd">여유</text>
  <text x="668" y="200" text-anchor="middle" font-size="9.5" fill="#2563eb">8 B × 4 = 32 B (오버할당)</text>

  <!-- 흩어진 객체 -->
  <line x1="605" y1="188" x2="800" y2="152" stroke="#64748b" stroke-width="1.4" marker-end="url(#lA)"/>
  <line x1="647" y1="188" x2="800" y2="192" stroke="#64748b" stroke-width="1.4" marker-end="url(#lA)"/>
  <line x1="689" y1="188" x2="800" y2="232" stroke="#64748b" stroke-width="1.4" marker-end="url(#lA)"/>

  <rect x="808" y="136" width="100" height="32" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
  <text x="858" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">int 1 · 28 B</text>
  <rect x="808" y="176" width="100" height="32" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
  <text x="858" y="197" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">int 2 · 28 B</text>
  <rect x="808" y="216" width="100" height="32" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
  <text x="858" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">int 3 · 28 B</text>

  <!-- 두 결론 -->
  <rect x="30" y="290" width="440" height="76" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="48" y="313" font-size="12.5" font-weight="700" fill="#15803d">✓ 아무 타입이나 섞어 담을 수 있습니다</text>
  <text x="48" y="333" font-size="11.5" fill="#166534">전부 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PyObject *</tspan> 니까요</text>
  <text x="48" y="355" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">[1, "two", [3], None]  # 전부 OK</text>

  <rect x="490" y="290" width="440" height="76" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="508" y="313" font-size="12.5" font-weight="700" fill="#b91c1c">✗ 캐시 지역성이 나쁩니다</text>
  <text x="508" y="333" font-size="11.5" fill="#7f1d1d">값을 읽으려면 매번 포인터를 따라가야 합니다</text>
  <text x="508" y="355" font-size="11.5" fill="#7f1d1d">그래서 수치 연산엔 NumPy가 필요합니다</text>

  <!-- 오버할당 -->
  <rect x="30" y="382" width="900" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="404" font-size="12.5" font-weight="700" fill="#334155">오버할당 — <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">append</tspan> 가 amortized O(1)인 이유</text>
  <text x="52" y="424" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#475569">new_allocated = (newsize + (newsize &gt;&gt; 3) + 6) &amp; ~3      /* Objects/listobject.c */</text>
  <text x="52" y="444" font-size="11.5" fill="#475569">용량 수열: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">0, 4, 8, 16, 24, 32, 40, 52, 64, 76 …</tspan>   약 1.125배 + 상수 — 2배보다 낭비가 적습니다</text>
</svg>

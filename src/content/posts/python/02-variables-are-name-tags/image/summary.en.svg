<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

  <defs>
    <marker id="arrSlateEn" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">Where a name is actually stored</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">the same line <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">x = 1</tspan> compiles to completely different bytecode depending on where it sits</text>

  <!-- ================= left: module level ================= -->
  <rect x="30" y="78" width="440" height="212" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="52" y="104" font-size="15" font-weight="700" fill="#1d4ed8">Module / class body — a real dictionary</text>

  <rect x="52" y="116" width="110" height="26" rx="6" fill="#dbeafe"/>
  <text x="62" y="134" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">x = 1</text>
  <text x="174" y="134" font-size="11" fill="#64748b">compiles to ↓</text>
  <rect x="270" y="116" width="178" height="26" rx="6" fill="#1e3a8a"/>
  <text x="359" y="134" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ffffff">STORE_NAME 0 (x)</text>

  <rect x="52" y="156" width="396" height="76" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="66" y="176" font-size="11" font-weight="700" fill="#1d4ed8">globals() — the dict itself</text>
  <rect x="66" y="184" width="150" height="30" rx="6" fill="#dbeafe"/>
  <text x="78" y="204" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">'x'</text>
  <text x="196" y="204" text-anchor="end" font-size="14" font-weight="800" fill="#2563eb">●</text>
  <text x="230" y="197" font-size="11.5" fill="#475569">string key → hash lookup</text>
  <text x="230" y="214" font-size="11.5" fill="#475569">poke a key in and the name exists</text>

  <text x="52" y="256" font-size="11.5" fill="#1d4ed8">· <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">globals()['h'] = 99</tspan> → <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">print(h)</tspan> works</text>
  <text x="52" y="277" font-size="11.5" fill="#1d4ed8">· lookups are <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LOAD_NAME</tspan> / <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LOAD_GLOBAL</tspan></text>

  <!-- ================= right: function locals ================= -->
  <rect x="490" y="78" width="440" height="212" rx="12" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="512" y="104" font-size="15" font-weight="700" fill="#7e22ce">Function local — not a dictionary at all</text>

  <rect x="512" y="116" width="110" height="26" rx="6" fill="#f3e8ff"/>
  <text x="522" y="134" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#581c87">x = 1</text>
  <text x="634" y="134" font-size="11" fill="#64748b">compiles to ↓</text>
  <rect x="730" y="116" width="178" height="26" rx="6" fill="#581c87"/>
  <text x="819" y="134" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ffffff">STORE_FAST 0</text>

  <rect x="512" y="156" width="396" height="76" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="526" y="176" font-size="11" font-weight="700" fill="#7e22ce">the locals array on the frame</text>
  <rect x="526" y="184" width="70" height="30" rx="6" fill="#f3e8ff"/>
  <text x="538" y="204" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#581c87">[0]</text>
  <text x="586" y="204" text-anchor="end" font-size="14" font-weight="800" fill="#9333ea">●</text>
  <rect x="602" y="184" width="70" height="30" rx="6" fill="#f3e8ff"/>
  <text x="614" y="204" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#581c87">[1]</text>
  <text x="662" y="204" text-anchor="end" font-size="14" font-weight="800" fill="#9333ea">●</text>
  <text x="686" y="197" font-size="11.5" fill="#475569">reached by integer index</text>
  <text x="686" y="214" font-size="11.5" fill="#475569">no hashing, no string compare</text>

  <text x="512" y="256" font-size="11.5" fill="#7e22ce">· names go into <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">co_varnames</tspan> at compile time and vanish at runtime</text>
  <text x="512" y="277" font-size="11.5" fill="#7e22ce">· <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">locals()</tspan> is a copy — only <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">f_locals</tspan> reaches the real storage (3.13+)</text>

  <!-- ================= below: either way, a pointer ================= -->
  <line x1="250" y1="290" x2="430" y2="330" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrSlateEn)"/>
  <line x1="710" y1="290" x2="530" y2="330" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrSlateEn)"/>

  <rect x="330" y="336" width="300" height="62" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="480" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">HEAP — the int object</text>
  <text x="480" y="381" text-anchor="middle" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#14532d">PyObject * → 1</text>

  <text x="668" y="372" font-size="11.5" fill="#64748b">the storage differs, but what</text>
  <text x="668" y="389" font-size="11.5" fill="#64748b">gets stored is a pointer either way</text>

  <!-- ================= bottom summary ================= -->
  <rect x="30" y="414" width="900" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="440" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Python has no variables — it has objects on the heap, and name tags stuck to them</text>
</svg>

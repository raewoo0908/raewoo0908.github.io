<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">변수는 상자인가, 이름표인가</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">같은 한 줄이 C와 Python에서 전혀 다른 일을 합니다</text>

  <!-- ================= 왼쪽: C ================= -->
  <rect x="30" y="78" width="430" height="292" rx="12" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1"/>
  <text x="52" y="106" font-size="15" font-weight="700" fill="#a16207">C — 변수는 메모리 위치입니다</text>

  <rect x="52" y="120" width="180" height="26" rx="6" fill="#fef3c7"/>
  <text x="62" y="138" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#78350f">int a = 5;</text>

  <text x="52" y="176" font-size="11" font-weight="700" fill="#a16207">STACK</text>
  <rect x="52" y="186" width="386" height="96" rx="8" fill="#ffffff" stroke="#e2cf9a" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="118" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">a</text>
  <rect x="76" y="220" width="84" height="44" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="118" y="248" text-anchor="middle" font-size="19" font-weight="800" fill="#78350f">5</text>
  <text x="118" y="278" text-anchor="middle" font-size="10" fill="#a16207">4 bytes</text>

  <text x="188" y="234" font-size="11.5" fill="#7c8794">이름이 곧 상자입니다.</text>
  <text x="188" y="252" font-size="11.5" fill="#7c8794">값이 그 안에 직접 들어갑니다.</text>

  <rect x="52" y="298" width="386" height="54" rx="8" fill="#fef3c7"/>
  <text x="66" y="319" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#78350f">a = 6;</text>
  <text x="66" y="340" font-size="11.5" fill="#a16207">→ 같은 상자의 내용이 바뀝니다</text>

  <!-- ================= 오른쪽: Python ================= -->
  <rect x="500" y="78" width="430" height="292" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="522" y="106" font-size="15" font-weight="700" fill="#1d4ed8">Python — 변수는 객체에 붙은 이름표입니다</text>

  <rect x="522" y="120" width="180" height="26" rx="6" fill="#dbeafe"/>
  <text x="532" y="138" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">a = 5</text>

  <text x="522" y="176" font-size="11" font-weight="700" fill="#1d4ed8">네임스페이스</text>
  <text x="748" y="176" font-size="11" font-weight="700" fill="#15803d">HEAP</text>

  <rect x="522" y="186" width="120" height="96" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="540" y="218" width="66" height="30" rx="15" fill="#3b82f6"/>
  <text x="573" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">a</text>
  <text x="582" y="270" text-anchor="middle" font-size="10" fill="#64748b">이름표</text>

  <!-- 화살표 -->
  <defs>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <line x1="608" y1="233" x2="700" y2="233" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="654" y="224" text-anchor="middle" font-size="10" fill="#2563eb">가리킨다</text>

  <rect x="708" y="186" width="200" height="96" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="808" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">int 객체</text>
  <rect x="722" y="214" width="172" height="20" fill="#dcfce7"/>
  <text x="730" y="228" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">ob_refcnt</text>
  <rect x="722" y="234" width="172" height="20" fill="#dcfce7"/>
  <text x="730" y="248" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">ob_type → int</text>
  <rect x="722" y="254" width="172" height="22" fill="#bbf7d0"/>
  <text x="730" y="270" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#14532d">value = 5</text>

  <rect x="522" y="298" width="386" height="54" rx="8" fill="#dbeafe"/>
  <text x="536" y="319" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">a = 6</text>
  <text x="536" y="340" font-size="11.5" fill="#1d4ed8">→ 이름표가 다른 객체로 옮겨 붙습니다</text>

  <!-- ================= 하단 요약 ================= -->
  <rect x="30" y="386" width="900" height="38" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="410" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Python의 모든 변수는 사실상 포인터입니다 — <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">*</tspan>도 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&amp;</tspan>도 안 보일 뿐입니다</text>
</svg>

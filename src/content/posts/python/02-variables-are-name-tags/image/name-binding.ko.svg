<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
  <defs>
    <marker id="nbArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">🏷️ 같은 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">x = 1</tspan> 이 어디에 있느냐로 저장 방식이 다릅니다</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">모듈에서는 딕셔너리 키, 함수 안에서는 배열 슬롯 — 담기는 건 언제나 포인터입니다</text>

  <!-- 왼쪽: 모듈 레벨 -->
  <rect x="30" y="78" width="430" height="256" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="52" y="104" font-size="14.5" font-weight="700" fill="#1d4ed8">모듈 · 클래스 바디 — 딕셔너리</text>

  <rect x="52" y="116" width="180" height="24" rx="5" fill="#dbeafe"/>
  <text x="62" y="133" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">x = 1</text>
  <text x="248" y="133" font-size="11" fill="#2563eb">↓ 컴파일 결과</text>
  <rect x="52" y="148" width="386" height="24" rx="5" fill="#1e3a8a"/>
  <text x="62" y="165" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#dbeafe">LOAD_CONST 0 (1)  ·  STORE_NAME 0 (x)</text>

  <text x="52" y="196" font-size="11" font-weight="700" fill="#1d4ed8">globals() — dict</text>
  <rect x="52" y="204" width="210" height="106" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <line x1="152" y1="204" x2="152" y2="310" stroke="#dbeafe" stroke-width="1"/>
  <text x="102" y="224" text-anchor="middle" font-size="8.5" font-weight="700" fill="#64748b">key · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PyObject *</tspan></text>
  <text x="207" y="224" text-anchor="middle" font-size="8.5" font-weight="700" fill="#64748b">value · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PyObject *</tspan></text>
  <line x1="52" y1="230" x2="262" y2="230" stroke="#dbeafe" stroke-width="1"/>
  <text x="102" y="252" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">"x"</text>
  <circle cx="207" cy="248" r="5" fill="#3b82f6"/>
  <text x="102" y="286" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">"y"</text>
  <circle cx="207" cy="282" r="5" fill="#3b82f6"/>

  <line x1="212" y1="248" x2="300" y2="240" stroke="#64748b" stroke-width="1.6" marker-end="url(#nbArrow)"/>
  <line x1="212" y1="282" x2="300" y2="252" stroke="#64748b" stroke-width="1.6" marker-end="url(#nbArrow)"/>

  <rect x="308" y="228" width="120" height="46" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="368" y="248" text-anchor="middle" font-size="11" fill="#15803d">int 객체</text>
  <text x="368" y="266" text-anchor="middle" font-size="15" font-weight="800" fill="#14532d">1</text>

  <text x="52" y="328" font-size="11.5" fill="#2563eb">이름이 <tspan font-weight="700">문자열 키</tspan>(인터닝된 str 객체)로 남습니다</text>

  <!-- 오른쪽: 함수 지역 -->
  <rect x="500" y="78" width="430" height="256" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="522" y="104" font-size="14.5" font-weight="700" fill="#7e22ce">함수 내부 — 배열</text>

  <rect x="522" y="116" width="180" height="24" rx="5" fill="#f3e8ff"/>
  <text x="532" y="133" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b21a8">def f(): x = 1</text>
  <text x="718" y="133" font-size="11" fill="#9333ea">↓ 컴파일 결과</text>
  <rect x="522" y="148" width="386" height="24" rx="5" fill="#581c87"/>
  <text x="532" y="165" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#f3e8ff">LOAD_CONST 1 (1)  ·  STORE_FAST 0 (x)</text>

  <text x="522" y="196" font-size="11" font-weight="700" fill="#7e22ce">프레임의 지역 배열 (이름 없음!)</text>
  <rect x="522" y="204" width="200" height="106" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
  <line x1="592" y1="204" x2="592" y2="310" stroke="#f3e8ff" stroke-width="1"/>
  <text x="557" y="224" text-anchor="middle" font-size="8.5" font-weight="700" fill="#64748b">index</text>
  <text x="657" y="224" text-anchor="middle" font-size="8.5" font-weight="700" fill="#64748b">value · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PyObject *</tspan></text>
  <line x1="522" y1="230" x2="722" y2="230" stroke="#f3e8ff" stroke-width="1"/>
  <text x="557" y="252" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#6b21a8">0</text>
  <circle cx="657" cy="248" r="5" fill="#9333ea"/>
  <text x="557" y="286" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#6b21a8">1</text>
  <circle cx="657" cy="282" r="5" fill="#9333ea"/>

  <line x1="662" y1="248" x2="770" y2="240" stroke="#64748b" stroke-width="1.6" marker-end="url(#nbArrow)"/>
  <line x1="662" y1="282" x2="770" y2="252" stroke="#64748b" stroke-width="1.6" marker-end="url(#nbArrow)"/>

  <rect x="778" y="228" width="120" height="46" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="838" y="248" text-anchor="middle" font-size="11" fill="#15803d">int 객체</text>
  <text x="838" y="266" text-anchor="middle" font-size="15" font-weight="800" fill="#14532d">1</text>

  <text x="522" y="328" font-size="11.5" fill="#9333ea">이름이 사라지고 <tspan font-weight="700">정수 인덱스</tspan>만 남습니다</text>

  <rect x="30" y="350" width="900" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">C 컴파일러가 지역변수를 스택 오프셋으로 바꾸는 최적화와 같은 발상입니다</text>
  <text x="480" y="391" text-anchor="middle" font-size="12" fill="#475569">딕셔너리의 키·값이든 배열 슬롯이든, 담기는 건 값이 아니라 언제나 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">PyObject *</tspan> 포인터입니다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

  <defs>
    <marker id="arrSlate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">이름은 어디에 저장되는가</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">같은 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">x = 1</tspan> 한 줄이 위치에 따라 전혀 다른 바이트코드가 됩니다</text>

  <!-- ================= 왼쪽: 모듈 레벨 ================= -->
  <rect x="30" y="78" width="440" height="212" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="52" y="104" font-size="15" font-weight="700" fill="#1d4ed8">모듈 · 클래스 본문 — 진짜 딕셔너리</text>

  <rect x="52" y="116" width="120" height="26" rx="6" fill="#dbeafe"/>
  <text x="62" y="134" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">x = 1</text>
  <text x="184" y="134" font-size="11" fill="#64748b">컴파일하면 ↓</text>
  <rect x="270" y="116" width="178" height="26" rx="6" fill="#1e3a8a"/>
  <text x="359" y="134" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ffffff">STORE_NAME 0 (x)</text>

  <rect x="52" y="156" width="396" height="76" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="66" y="176" font-size="11" font-weight="700" fill="#1d4ed8">globals() — dict 그 자체</text>
  <rect x="66" y="184" width="150" height="30" rx="6" fill="#dbeafe"/>
  <text x="78" y="204" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">'x'</text>
  <text x="196" y="204" text-anchor="end" font-size="14" font-weight="800" fill="#2563eb">●</text>
  <text x="230" y="197" font-size="11.5" fill="#475569">문자열 키 → 해시 조회</text>
  <text x="230" y="214" font-size="11.5" fill="#475569">직접 꽂으면 이름이 실제로 생긴다</text>

  <text x="52" y="256" font-size="11.5" fill="#1d4ed8">· <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">globals()['h'] = 99</tspan> → <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">print(h)</tspan> 가 동작합니다</text>
  <text x="52" y="277" font-size="11.5" fill="#1d4ed8">· 조회는 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LOAD_NAME</tspan> / <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LOAD_GLOBAL</tspan></text>

  <!-- ================= 오른쪽: 함수 지역 ================= -->
  <rect x="490" y="78" width="440" height="212" rx="12" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="512" y="104" font-size="15" font-weight="700" fill="#7e22ce">함수 지역 — 딕셔너리가 아닙니다</text>

  <rect x="512" y="116" width="120" height="26" rx="6" fill="#f3e8ff"/>
  <text x="522" y="134" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#581c87">x = 1</text>
  <text x="644" y="134" font-size="11" fill="#64748b">컴파일하면 ↓</text>
  <rect x="730" y="116" width="178" height="26" rx="6" fill="#581c87"/>
  <text x="819" y="134" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ffffff">STORE_FAST 0</text>

  <rect x="512" y="156" width="396" height="76" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="526" y="176" font-size="11" font-weight="700" fill="#7e22ce">프레임에 딸린 지역 배열</text>
  <rect x="526" y="184" width="70" height="30" rx="6" fill="#f3e8ff"/>
  <text x="538" y="204" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#581c87">[0]</text>
  <text x="586" y="204" text-anchor="end" font-size="14" font-weight="800" fill="#9333ea">●</text>
  <rect x="602" y="184" width="70" height="30" rx="6" fill="#f3e8ff"/>
  <text x="614" y="204" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#581c87">[1]</text>
  <text x="662" y="204" text-anchor="end" font-size="14" font-weight="800" fill="#9333ea">●</text>
  <text x="686" y="197" font-size="11.5" fill="#475569">정수 인덱스로 바로 접근</text>
  <text x="686" y="214" font-size="11.5" fill="#475569">해시도 문자열 비교도 없음</text>

  <text x="512" y="256" font-size="11.5" fill="#7e22ce">· 이름은 컴파일 때 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">co_varnames</tspan>로 들어가고 실행 중엔 안 쓰입니다</text>
  <text x="512" y="277" font-size="11.5" fill="#7e22ce">· <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">locals()</tspan>는 사본 — 진짜 저장소는 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">f_locals</tspan> 프록시로만 (3.13+)</text>

  <!-- ================= 아래: 어느 쪽이든 포인터 ================= -->
  <line x1="250" y1="290" x2="430" y2="330" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrSlate)"/>
  <line x1="710" y1="290" x2="530" y2="330" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrSlate)"/>

  <rect x="330" y="336" width="300" height="62" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="480" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">HEAP — int 객체</text>
  <text x="480" y="381" text-anchor="middle" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#14532d">PyObject * → 1</text>

  <text x="668" y="372" font-size="11.5" fill="#64748b">저장 방식은 달라도</text>
  <text x="668" y="389" font-size="11.5" fill="#64748b">담기는 건 똑같이 포인터입니다</text>

  <!-- ================= 하단 요약 ================= -->
  <rect x="30" y="414" width="900" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="440" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Python에 변수는 없습니다 — 힙에 있는 객체와, 그 객체에 붙은 이름표가 있을 뿐입니다</text>
</svg>

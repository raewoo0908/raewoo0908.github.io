<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

  <defs>
    <marker id="uArr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">if does not take a bool — it turns whatever it gets into one</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">Not one of the three stages ever asks "is this type bool?"</text>

  <!-- 1) grammar -->
  <rect x="24" y="80" width="296" height="286" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="24" y="80" width="296" height="34" rx="12" fill="#dbeafe"/>
  <rect x="24" y="102" width="296" height="12" fill="#dbeafe"/>
  <text x="44" y="103" font-size="13" font-weight="700" fill="#1e3a8a">1. Grammar — no type check</text>

  <rect x="44" y="130" width="256" height="46" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="58" y="150" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">'if' named_expression ':'</text>
  <text xml:space="preserve" x="58" y="168" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#dc2626">        → expression</text>

  <text x="44" y="202" font-size="12" fill="#1d4ed8">Just an "expression". Nothing says it</text>
  <text x="44" y="222" font-size="12" fill="#1d4ed8">has to be a bool.</text>
  <text x="44" y="248" font-size="12" font-weight="700" fill="#1d4ed8">→ no place for a syntax error</text>

  <rect x="44" y="266" width="256" height="82" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="58" y="288" font-size="11.5" fill="#64748b">Java · Go — bool only</text>
  <text x="58" y="310" font-size="11.5" fill="#64748b">C — scalars become != 0</text>
  <text x="58" y="334" font-size="11.5" font-weight="700" fill="#1d4ed8">Python — any expression</text>

  <line x1="326" y1="220" x2="352" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#uArr)"/>

  <!-- 2) compile -->
  <rect x="358" y="80" width="272" height="286" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <rect x="358" y="80" width="272" height="34" rx="12" fill="#ffedd5"/>
  <rect x="358" y="102" width="272" height="12" fill="#ffedd5"/>
  <text x="378" y="103" font-size="13" font-weight="700" fill="#7c2d12">2. Compile — wrapped in TO_BOOL</text>

  <rect x="378" y="130" width="232" height="70" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
  <text x="392" y="150" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7c2d12">LOAD_NAME  x</text>
  <rect x="388" y="156" width="130" height="20" rx="4" fill="#ffedd5"/>
  <text x="392" y="171" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#7c2d12">TO_BOOL</text>
  <text x="392" y="192" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7c2d12">POP_JUMP_IF_FALSE</text>

  <text x="378" y="226" font-size="11.5" fill="#c2410c">Except these, where TO_BOOL never appears</text>
  <rect x="378" y="240" width="232" height="46" rx="6" fill="#ffffff"/>
  <text x="390" y="261" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#7c2d12">if 2:</text>
  <text x="390" y="279" font-size="11.5" fill="#7c2d12">constant folded away</text>

  <rect x="378" y="298" width="232" height="46" rx="6" fill="#ffffff"/>
  <text x="390" y="319" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#7c2d12">if a == b:</text>
  <text x="390" y="337" font-size="11.5" fill="#7c2d12">COMPARE_OP handles it</text>

  <line x1="636" y1="220" x2="662" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#uArr)"/>

  <!-- 3) runtime -->
  <rect x="668" y="80" width="268" height="286" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="668" y="80" width="268" height="34" rx="12" fill="#ede9fe"/>
  <rect x="668" y="102" width="268" height="12" fill="#ede9fe"/>
  <text x="688" y="103" font-size="13" font-weight="700" fill="#5b21b6">3. Runtime — PyObject_IsTrue</text>

  <rect x="688" y="126" width="228" height="24" rx="5" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="700" y="143" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5b21b6">Py_True → true</text>
  <rect x="688" y="154" width="228" height="24" rx="5" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="700" y="171" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5b21b6">Py_False → false</text>
  <rect x="688" y="182" width="228" height="24" rx="5" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="700" y="199" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5b21b6">Py_None → false</text>
  <rect x="688" y="210" width="228" height="24" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="700" y="227" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#5b21b6">nb_bool  ← __bool__</text>
  <rect x="688" y="238" width="228" height="24" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="700" y="255" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#5b21b6">mp_length ← __len__</text>
  <rect x="688" y="266" width="228" height="24" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="700" y="283" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#5b21b6">sq_length ← __len__</text>
  <rect x="688" y="294" width="228" height="54" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="700" y="315" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#78350f">else return 1;</text>
  <text x="700" y="337" font-size="11" fill="#a16207">→ no way to answer? true anyway</text>

  <!-- bottom -->
  <rect x="24" y="382" width="912" height="66" rx="10" fill="#0f172a"/>
  <text x="480" y="410" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">"Empty is falsy" is not a law of the language — it is just __len__ returning 0</text>
  <text x="480" y="432" text-anchor="middle" font-size="12.5" fill="#94a3b8">That is why generators and file objects, which have no __len__, are truthy even when empty</text>
</svg>

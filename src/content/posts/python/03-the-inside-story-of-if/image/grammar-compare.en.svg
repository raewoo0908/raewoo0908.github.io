<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">What each language allows in an if condition</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">It comes down to whether the grammar checks the type at all</text>

  <!-- ============ Java / Go ============ -->
  <rect x="24" y="78" width="292" height="232" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="44" y="106" font-size="15" font-weight="700" fill="#b91c1c">Java · Go — bool only</text>

  <rect x="44" y="120" width="252" height="30" rx="6" fill="#fee2e2"/>
  <text x="56" y="140" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7f1d1d">if (flag) { ... }</text>
  <text x="278" y="140" text-anchor="end" font-size="14" font-weight="700" fill="#16a34a">✓</text>

  <rect x="44" y="158" width="252" height="30" rx="6" fill="#fee2e2"/>
  <text x="56" y="178" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7f1d1d">if (1) { ... }</text>
  <text x="278" y="178" text-anchor="end" font-size="14" font-weight="700" fill="#dc2626">✗</text>

  <rect x="44" y="204" width="252" height="86" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="58" y="228" font-size="11.5" fill="#991b1b">The compiler rejects it</text>
  <text x="58" y="250" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#b91c1c">int cannot be converted</text>
  <text x="58" y="266" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#b91c1c">to boolean</text>
  <text x="58" y="284" font-size="11" fill="#7c8794">The grammar pins down the type</text>

  <!-- ============ C ============ -->
  <rect x="334" y="78" width="292" height="232" rx="12" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1"/>
  <text x="354" y="106" font-size="15" font-weight="700" fill="#a16207">C — scalars too</text>

  <rect x="354" y="120" width="252" height="30" rx="6" fill="#fef3c7"/>
  <text x="366" y="140" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#78350f">if (1) { ... }</text>
  <text x="588" y="140" text-anchor="end" font-size="14" font-weight="700" fill="#16a34a">✓</text>

  <rect x="354" y="158" width="252" height="30" rx="6" fill="#fef3c7"/>
  <text x="366" y="178" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#78350f">if (some_struct) { ... }</text>
  <text x="588" y="178" text-anchor="end" font-size="14" font-weight="700" fill="#dc2626">✗</text>

  <rect x="354" y="204" width="252" height="86" rx="8" fill="#ffffff" stroke="#e2cf9a" stroke-width="1"/>
  <text x="368" y="228" font-size="11.5" fill="#a16207">Integers, floats and pointers</text>
  <text x="368" y="248" font-size="11.5" fill="#a16207">
    become <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">!= 0</tspan>
  </text>
  <text x="368" y="272" font-size="11" fill="#7c8794">A struct is still a compile error</text>

  <!-- ============ Python ============ -->
  <rect x="644" y="78" width="292" height="232" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="664" y="106" font-size="15" font-weight="700" fill="#1d4ed8">Python — any expression</text>

  <rect x="664" y="120" width="252" height="30" rx="6" fill="#dbeafe"/>
  <text x="676" y="140" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">if 2: ...</text>
  <text x="898" y="140" text-anchor="end" font-size="14" font-weight="700" fill="#16a34a">✓</text>

  <rect x="664" y="158" width="252" height="30" rx="6" fill="#dbeafe"/>
  <text x="676" y="178" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">if object(): ...</text>
  <text x="898" y="178" text-anchor="end" font-size="14" font-weight="700" fill="#16a34a">✓</text>

  <rect x="664" y="204" width="252" height="86" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="678" y="228" font-size="11.5" fill="#1d4ed8">The grammar never looks at types</text>
  <text x="678" y="252" font-size="11.5" fill="#1d4ed8">so there is <tspan font-weight="700">no place</tspan> for a</text>
  <text x="678" y="272" font-size="11.5" font-weight="700" fill="#1d4ed8">syntax error to happen</text>

  <!-- ============ bottom: the real grammar ============ -->
  <rect x="24" y="330" width="912" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="354" font-size="11.5" font-weight="700" fill="#64748b">CPython 3.13 — Grammar/python.gram</text>

  <text x="44" y="380" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155">if_stmt: 'if' <tspan font-weight="700" fill="#1d4ed8">named_expression</tspan> ':' block ...</text>

  <defs>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="430" y1="376" x2="470" y2="376" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <text x="482" y="380" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155">named_expression: ... | <tspan font-weight="700" fill="#dc2626">expression</tspan> !':='</text>

  <text x="44" y="404" font-size="12" fill="#64748b">
    The condition slot is just an <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#dc2626">expression</tspan> — nowhere does it say "must be a bool"
  </text>
</svg>

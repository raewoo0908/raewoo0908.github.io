<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>

  <defs>
    <marker id="dArr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/>
    </marker>
    <marker id="dArrB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">Dunder methods get plugged into type object slots</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">PyObject_IsTrue searches these slots, not method names</text>

  <!-- left: python class -->
  <rect x="24" y="82" width="270" height="216" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="44" y="106" font-size="13" font-weight="700" fill="#1d4ed8">The Python class you wrote</text>

  <rect x="44" y="120" width="230" height="160" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="58" y="144" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">class Box:</text>
  <rect x="54" y="152" width="212" height="22" rx="4" fill="#dbeafe"/>
  <text xml:space="preserve" x="62" y="168" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#1e3a8a">    def __bool__(self):</text>
  <text xml:space="preserve" x="58" y="192" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#64748b">        return ...</text>
  <rect x="54" y="204" width="212" height="22" rx="4" fill="#ede9fe"/>
  <text xml:space="preserve" x="62" y="220" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#5b21b6">    def __len__(self):</text>
  <text xml:space="preserve" x="58" y="244" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#64748b">        return ...</text>
  <text x="58" y="268" font-size="11" fill="#7c8794">the moment the class is created</text>

  <!-- middle: type object slots -->
  <rect x="336" y="82" width="288" height="216" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="356" y="106" font-size="13" font-weight="700" fill="#6d28d9">PyTypeObject — slots</text>

  <rect x="356" y="120" width="248" height="52" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="370" y="140" font-size="10.5" font-weight="700" fill="#7c3aed">tp_as_number</text>
  <rect x="366" y="144" width="228" height="22" rx="4" fill="#ede9fe"/>
  <text x="374" y="160" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#5b21b6">nb_bool</text>

  <rect x="356" y="182" width="248" height="52" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="370" y="202" font-size="10.5" font-weight="700" fill="#7c3aed">tp_as_mapping</text>
  <rect x="366" y="206" width="228" height="22" rx="4" fill="#ede9fe"/>
  <text x="374" y="222" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#5b21b6">mp_length</text>

  <rect x="356" y="244" width="248" height="52" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="370" y="264" font-size="10.5" font-weight="700" fill="#7c3aed">tp_as_sequence</text>
  <rect x="366" y="268" width="228" height="22" rx="4" fill="#ede9fe"/>
  <text x="374" y="284" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#5b21b6">sq_length</text>

  <!-- links -->
  <path d="M 278 163 C 312 163, 322 155, 356 155" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#dArrB)"/>
  <path d="M 278 215 C 312 215, 322 217, 356 217" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#dArr)"/>
  <path d="M 278 215 C 316 215, 320 279, 356 279" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#dArr)"/>

  <!-- right: lookup order -->
  <rect x="666" y="82" width="270" height="216" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="686" y="106" font-size="13" font-weight="700" fill="#334155">PyObject_IsTrue's order</text>

  <rect x="686" y="122" width="230" height="40" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="700" y="147" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#5b21b6">1. nb_bool</text>
  <text x="838" y="147" font-size="11" fill="#7c3aed">stops here</text>

  <rect x="686" y="170" width="230" height="40" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="700" y="195" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#5b21b6">2. mp_length</text>

  <rect x="686" y="218" width="230" height="40" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="700" y="243" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#5b21b6">3. sq_length</text>

  <rect x="686" y="266" width="230" height="20" rx="6" fill="#fef3c7"/>
  <text x="700" y="281" font-size="11.5" font-weight="700" fill="#78350f">4. all empty → true</text>

  <line x1="630" y1="190" x2="660" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#dArrB)"/>

  <!-- bottom -->
  <rect x="24" y="316" width="912" height="102" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="340" font-size="11.5" font-weight="700" fill="#64748b">CPython 3.13 — Objects/typeobject.c · slotdefs[]</text>
  <text x="44" y="364" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155">UNSLOT(__bool__, nb_bool,   slot_nb_bool,   ...)</text>
  <text x="44" y="384" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155">MPSLOT(__len__,  mp_length, slot_mp_length, ...)</text>
  <text x="44" y="404" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155">SQSLOT(__len__,  sq_length, slot_sq_length, ...)</text>
  <text x="520" y="374" font-size="12" fill="#5b21b6">
    A single <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">__len__</tspan> fills both slots at once
  </text>
  <text x="520" y="396" font-size="11.5" fill="#7c8794">so from Python you never have to tell steps 2 and 3 apart</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="660" fill="#ffffff"/>

  <defs>
    <marker id="fArr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="fArrG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">PyObject_IsTrue — it asks exactly these questions, in this order</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">The first match wins, and if nothing matches the last line returns true no matter what</text>

  <!-- input -->
  <rect x="60" y="76" width="370" height="42" rx="8" fill="#0f172a"/>
  <text x="245" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PyObject *v</text>
  <text x="446" y="103" font-size="11.5" fill="#7c8794">whatever object sits in the if condition</text>

  <!-- ===== group 1 ===== -->
  <rect x="36" y="132" width="888" height="176" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="154" font-size="12" font-weight="700" fill="#64748b">Step 1 — singletons first</text>
  <text x="290" y="154" font-size="12" fill="#94a3b8">filtered by address — the fast path, no slots involved</text>

  <!-- 1 -->
  <rect x="60" y="164" width="370" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="76" y="188" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0f172a">v == Py_True ?</text>
  <line x1="436" y1="183" x2="560" y2="183" stroke="#16a34a" stroke-width="1.6" marker-end="url(#fArrG)"/>
  <text x="498" y="176" text-anchor="middle" font-size="10" fill="#16a34a">yes</text>
  <rect x="566" y="166" width="120" height="34" rx="17" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="626" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">true (1)</text>

  <!-- 2 -->
  <rect x="60" y="212" width="370" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="76" y="236" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0f172a">v == Py_False ?</text>
  <line x1="436" y1="231" x2="560" y2="231" stroke="#16a34a" stroke-width="1.6" marker-end="url(#fArrG)"/>
  <text x="498" y="224" text-anchor="middle" font-size="10" fill="#16a34a">yes</text>
  <rect x="566" y="214" width="120" height="34" rx="17" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="626" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">false (0)</text>

  <!-- 3 -->
  <rect x="60" y="260" width="370" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="76" y="284" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0f172a">v == Py_None ?</text>
  <line x1="436" y1="279" x2="560" y2="279" stroke="#16a34a" stroke-width="1.6" marker-end="url(#fArrG)"/>
  <text x="498" y="272" text-anchor="middle" font-size="10" fill="#16a34a">yes</text>
  <rect x="566" y="262" width="120" height="34" rx="17" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="626" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">false (0)</text>

  <text x="706" y="200" font-size="11" fill="#7c8794">All three are singletons —</text>
  <text x="706" y="218" font-size="11" fill="#7c8794">one instance each, so comparing</text>
  <text x="706" y="236" font-size="11" fill="#7c8794">addresses is enough</text>
  <text x="706" y="262" font-size="11" fill="#7c8794">The answer is the same without</text>
  <text x="706" y="280" font-size="11" font-weight="700" fill="#64748b">this step; it is just a fast path</text>

  <!-- ===== group 2 ===== -->
  <rect x="36" y="322" width="888" height="212" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="56" y="344" font-size="12" font-weight="700" fill="#1d4ed8">Step 2 — slot lookup</text>
  <text x="290" y="344" font-size="12" fill="#60a5fa">walk the type object's slots in order — this is where dunders come in</text>

  <!-- 4 -->
  <rect x="60" y="354" width="370" height="46" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="76" y="374" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#1e3a8a">is there an nb_bool slot?</text>
  <text x="76" y="392" font-size="11" fill="#2563eb">← Python's __bool__</text>
  <line x1="436" y1="377" x2="560" y2="377" stroke="#16a34a" stroke-width="1.6" marker-end="url(#fArrG)"/>
  <text x="498" y="370" text-anchor="middle" font-size="10" fill="#16a34a">yes</text>
  <rect x="566" y="358" width="330" height="38" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="582" y="382" font-size="12" fill="#1e3a8a">calling it gives the answer <tspan font-size="11" fill="#2563eb">(TypeError if not a bool)</tspan></text>

  <!-- 5 -->
  <rect x="60" y="412" width="370" height="46" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="76" y="432" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#1e3a8a">is there an mp_length slot?</text>
  <text x="76" y="450" font-size="11" fill="#2563eb">← Python's __len__ (mapping)</text>
  <line x1="436" y1="435" x2="560" y2="435" stroke="#16a34a" stroke-width="1.6" marker-end="url(#fArrG)"/>
  <text x="498" y="428" text-anchor="middle" font-size="10" fill="#16a34a">yes</text>
  <rect x="566" y="416" width="330" height="38" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="582" y="440" font-size="12" fill="#1e3a8a">true if length &gt; <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">0</tspan> <tspan font-size="11" fill="#2563eb">← "empty is falsy" comes from here</tspan></text>

  <!-- 6 -->
  <rect x="60" y="470" width="370" height="46" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="76" y="490" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#1e3a8a">is there an sq_length slot?</text>
  <text x="76" y="508" font-size="11" fill="#2563eb">← Python's __len__ (sequence)</text>
  <line x1="436" y1="493" x2="560" y2="493" stroke="#16a34a" stroke-width="1.6" marker-end="url(#fArrG)"/>
  <text x="498" y="486" text-anchor="middle" font-size="10" fill="#16a34a">yes</text>
  <rect x="566" y="474" width="330" height="38" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="582" y="498" font-size="12" fill="#1e3a8a">true if length &gt; <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">0</tspan></text>

  <!-- fallthrough arrows -->
  <line x1="245" y1="118" x2="245" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#fArr)"/>
  <line x1="245" y1="202" x2="245" y2="208" stroke="#64748b" stroke-width="1.5" marker-end="url(#fArr)"/>
  <line x1="245" y1="250" x2="245" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#fArr)"/>
  <line x1="245" y1="298" x2="245" y2="350" stroke="#64748b" stroke-width="1.5" marker-end="url(#fArr)"/>
  <line x1="245" y1="400" x2="245" y2="408" stroke="#64748b" stroke-width="1.5" marker-end="url(#fArr)"/>
  <line x1="245" y1="458" x2="245" y2="466" stroke="#64748b" stroke-width="1.5" marker-end="url(#fArr)"/>
  <line x1="245" y1="516" x2="245" y2="566" stroke="#64748b" stroke-width="2" marker-end="url(#fArr)"/>
  <text x="262" y="326" font-size="10.5" fill="#64748b">no</text>
  <text x="262" y="546" font-size="10.5" font-weight="700" fill="#64748b">none of the three</text>

  <!-- ===== last ===== -->
  <rect x="36" y="572" width="888" height="70" rx="12" fill="#fefce8" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="60" y="586" width="370" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="76" y="613" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#78350f">else  return 1;</text>
  <line x1="436" y1="607" x2="560" y2="607" stroke="#16a34a" stroke-width="1.6" marker-end="url(#fArrG)"/>
  <rect x="566" y="590" width="120" height="34" rx="17" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="626" y="612" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">true (1)</text>
  <text x="706" y="602" font-size="11.5" font-weight="700" fill="#a16207">This line is why object() is truthy</text>
  <text x="706" y="620" font-size="11" fill="#a16207">No answer? Then it counts as true</text>
</svg>

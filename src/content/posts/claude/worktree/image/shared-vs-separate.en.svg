<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 546" width="960" height="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <filter id="cardShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="546" fill="#ffffff"/>

  <text x="480" y="52" text-anchor="middle" font-size="29" font-weight="800" fill="#1a1a1a">What a worktree shares, and what it keeps to itself</text>
  <text x="480" y="84" text-anchor="middle" font-size="16" fill="#5c6672">Know this boundary and most worktree surprises explain themselves</text>

  <!-- ============ LEFT: shared ============ -->
  <rect x="32" y="112" width="440" height="340" rx="14" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1" filter="url(#cardShadow3)"/>
  <path d="M32,164 L32,126 Q32,112 46,112 L458,112 Q472,112 472,126 L472,164 Z" fill="#059669"/>
  <text x="52" y="145" font-size="16.5" font-weight="700" fill="#ffffff">🔗 Shared (one repository)</text>

  <circle cx="66" cy="196" r="4" fill="#059669"/>
  <text x="84" y="201" font-size="14.5" fill="#1f2937">Commits, objects, tags</text>
  <circle cx="66" cy="242" r="4" fill="#059669"/>
  <text x="84" y="247" font-size="14.5" fill="#1f2937">Branch list and remotes</text>
  <circle cx="66" cy="288" r="4" fill="#059669"/>
  <text x="84" y="293" font-size="14.5" fill="#1f2937">The stash stack</text>
  <circle cx="66" cy="334" r="4" fill="#059669"/>
  <text x="84" y="339" font-size="14.5" fill="#1f2937">Project-scope plugins</text>
  <circle cx="66" cy="380" r="4" fill="#059669"/>
  <text x="84" y="385" font-size="14.5" fill="#1f2937">Permission approvals (settings.local.json)</text>

  <text x="66" y="426" font-size="13" fill="#047857">→ Commit anywhere; the history stays one</text>

  <!-- ============ RIGHT: separate ============ -->
  <rect x="488" y="112" width="440" height="340" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1" filter="url(#cardShadow3)"/>
  <path d="M488,164 L488,126 Q488,112 502,112 L914,112 Q928,112 928,126 L928,164 Z" fill="#d97706"/>
  <text x="508" y="145" font-size="16.5" font-weight="700" fill="#ffffff">✂️ Separate per worktree</text>

  <circle cx="522" cy="196" r="4" fill="#d97706"/>
  <text x="540" y="201" font-size="14.5" fill="#1f2937">Working tree files and HEAD</text>
  <circle cx="522" cy="242" r="4" fill="#d97706"/>
  <text x="540" y="247" font-size="14.5" fill="#1f2937">The index (staging area)</text>
  <circle cx="522" cy="288" r="4" fill="#d97706"/>
  <text x="540" y="293" font-size="14.5" fill="#1f2937">git dir → .git/worktrees/&lt;name&gt;</text>
  <circle cx="522" cy="334" r="4" fill="#d97706"/>
  <text x="540" y="339" font-size="14.5" fill="#1f2937">node_modules, dist, build output</text>
  <circle cx="522" cy="380" r="4" fill="#d97706"/>
  <text x="540" y="385" font-size="14.5" fill="#1f2937">Untracked files such as .env</text>

  <text x="522" y="426" font-size="13" fill="#b45309">→ A split git dir splits every cache keyed on it</text>

  <!-- bottom note -->
  <rect x="32" y="474" width="896" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="504" text-anchor="middle" font-size="14.5" fill="#334155">A new worktree starts with <tspan font-weight="700" fill="#1f2937">npm install</tspan>. Copy .env in automatically with <tspan font-weight="700" fill="#1f2937">.worktreeinclude</tspan>.</text>
</svg>

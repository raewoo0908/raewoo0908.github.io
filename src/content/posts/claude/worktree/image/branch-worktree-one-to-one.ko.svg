<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <defs>
    <filter id="cardShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <marker id="arrLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <text x="480" y="46" text-anchor="middle" font-size="29" font-weight="800" fill="#1a1a1a">워크트리 : 브랜치 = 1 : 1</text>
  <text x="480" y="76" text-anchor="middle" font-size="15.5" fill="#5c6672">분기는 얼마든지 자유롭지만, 한 브랜치의 점유는 배타적입니다</text>

  <!-- ================= Zone 1: 현재 상태 ================= -->
  <rect x="32" y="100" width="896" height="248" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="126" font-size="12.5" font-weight="700" fill="#64748b" letter-spacing="0.4">지금 이 저장소의 상태</text>

  <!-- commit line -->
  <line x1="100" y1="200" x2="380" y2="200" stroke="#cbd5e1" stroke-width="2.5"/>
  <circle cx="100" cy="200" r="7" fill="#94a3b8"/>
  <circle cx="240" cy="200" r="7" fill="#7c3aed"/>
  <circle cx="380" cy="200" r="7" fill="#2563eb"/>
  <circle cx="240" cy="200" r="13" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="240" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">분기점</text>
  <text x="380" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">main</text>
  <text x="100" y="226" text-anchor="middle" font-size="11" fill="#64748b">998c9f6</text>
  <text x="240" y="226" text-anchor="middle" font-size="11" fill="#64748b">5f84af0</text>
  <text x="380" y="226" text-anchor="middle" font-size="11" fill="#64748b">e7ee097</text>

  <!-- branch curve -->
  <path d="M240,200 C 280,200 305,300 350,300" fill="none" stroke="#c4b5fd" stroke-width="2.5"/>
  <circle cx="350" cy="300" r="7" fill="#7c3aed"/>
  <text x="350" y="326" text-anchor="middle" font-size="11" fill="#64748b">5f84af0</text>

  <!-- arrows to cards -->
  <line x1="392" y1="196" x2="460" y2="178" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrLight)"/>
  <line x1="362" y1="296" x2="460" y2="282" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrLight)"/>

  <!-- card A -->
  <rect x="470" y="136" width="440" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#cardShadow4)"/>
  <text x="492" y="164" font-size="13.5" font-weight="700" fill="#1f2937">🖥️ 메인 워크트리</text>
  <text x="492" y="186" font-size="11.5" fill="#64748b">/Users/raewookang/GithubBlog</text>
  <text x="492" y="208" font-size="12.5" font-weight="700" fill="#2563eb">🔒 main</text>

  <!-- card B -->
  <rect x="470" y="240" width="440" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#cardShadow4)"/>
  <text x="492" y="268" font-size="13.5" font-weight="700" fill="#1f2937">🔗 링크된 워크트리</text>
  <text x="492" y="290" font-size="11.5" fill="#64748b">.claude/worktrees/post-worktree-guide</text>
  <text x="492" y="312" font-size="12.5" font-weight="700" fill="#7c3aed">🔒 claude/post-git-vs-claude-worktree</text>

  <!-- ================= Zone 2: 여기서 더 만들 수 있나 ================= -->
  <rect x="32" y="372" width="440" height="212" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="52" y="402" font-size="15" font-weight="700" fill="#b91c1c">✗ 이미 점유된 브랜치를 또 체크아웃</text>
  <text x="52" y="434" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2937">git worktree add ../x main</text>
  <text x="52" y="466" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#b91c1c">fatal: 'main' is already used by</text>
  <text x="52" y="484" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#b91c1c">worktree at '/…/GithubBlog'</text>
  <text x="52" y="522" font-size="12.5" fill="#7f1d1d">메인 체크아웃도 워크트리로 셉니다</text>
  <text x="52" y="546" font-size="11.5" fill="#b91c1c">--force 로 뚫으면 두 작업 트리가 서로를</text>
  <text x="52" y="564" font-size="11.5" fill="#b91c1c">삭제로 인식합니다</text>

  <rect x="488" y="372" width="440" height="212" rx="12" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="1"/>
  <text x="508" y="402" font-size="15" font-weight="700" fill="#047857">✓ 그 브랜치에서 새로 분기</text>
  <text x="508" y="434" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2937">git worktree add ../y -b new main</text>
  <text x="508" y="466" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#047857">Preparing worktree</text>
  <text x="508" y="484" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#047857">(new branch 'new')</text>
  <text x="508" y="522" font-size="12.5" fill="#065f46">분기는 얼마든지 자유롭습니다</text>
  <text x="508" y="546" font-size="11.5" fill="#047857">이 글을 쓴 워크트리가 바로 이 경우 —</text>
  <text x="508" y="564" font-size="11.5" fill="#047857">5f84af0 에서 새 브랜치로 갈라져 나왔습니다</text>

  <text x="480" y="616" text-anchor="middle" font-size="14" fill="#5c6672">읽기만 할 거면 <tspan font-weight="700" fill="#1f2937">--detach</tspan> 로 브랜치 없이 붙일 수 있습니다. 브랜치를 안 잡으니 몇 개든 됩니다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <filter id="cardShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="570" fill="#ffffff"/>

  <text x="480" y="52" text-anchor="middle" font-size="29" font-weight="800" fill="#1a1a1a">Swapping vs adding a desk</text>
  <text x="480" y="84" text-anchor="middle" font-size="16" fill="#5c6672">A branch empties one desk and refills it. A worktree gives you another desk.</text>

  <!-- ============ LEFT: git switch ============ -->
  <rect x="32" y="112" width="440" height="404" rx="14" fill="#fef2f2" stroke="#fee2e2" stroke-width="1" filter="url(#cardShadow2)"/>
  <path d="M32,164 L32,126 Q32,112 46,112 L458,112 Q472,112 472,126 L472,164 Z" fill="#dc2626"/>
  <text x="52" y="145" font-size="16" font-weight="700" fill="#ffffff">git switch — swap the one desk</text>

  <rect x="72" y="196" width="360" height="72" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="92" y="224" font-size="14.5" font-weight="700" fill="#1f2937">📁 ~/project</text>
  <text x="92" y="250" font-size="13" fill="#5c6672">feature-a files laid out here</text>

  <line x1="252" y1="276" x2="252" y2="322" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="268" y="304" font-size="13.5" font-weight="600" fill="#dc2626">git switch main</text>

  <rect x="72" y="332" width="360" height="72" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="92" y="360" font-size="14.5" font-weight="700" fill="#1f2937">📁 ~/project</text>
  <text x="92" y="386" font-size="13" fill="#5c6672">replaced wholesale by main files</text>

  <text x="72" y="440" font-size="13.5" fill="#b91c1c">⚠️ Work in progress must go to a stash</text>
  <text x="72" y="466" font-size="13.5" fill="#b91c1c">⚠️ A pop conflict waits on the way back</text>
  <text x="72" y="492" font-size="13.5" fill="#b91c1c">⚠️ Build output mixes across branches</text>

  <!-- ============ RIGHT: git worktree ============ -->
  <rect x="488" y="112" width="440" height="404" rx="14" fill="#eff6ff" stroke="#dbeafe" stroke-width="1" filter="url(#cardShadow2)"/>
  <path d="M488,164 L488,126 Q488,112 502,112 L914,112 Q928,112 928,126 L928,164 Z" fill="#2563eb"/>
  <text x="508" y="145" font-size="16" font-weight="700" fill="#ffffff">git worktree — add another desk</text>

  <rect x="608" y="192" width="200" height="52" rx="10" fill="#1e293b"/>
  <text x="708" y="223" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">.git (shared)</text>

  <path d="M708,244 L708,268 L604,268 L604,300" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <path d="M708,244 L708,268 L812,268 L812,300" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <rect x="512" y="308" width="184" height="96" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="532" y="336" font-size="14" font-weight="700" fill="#1f2937">📁 ~/project</text>
  <text x="532" y="360" font-size="12.5" fill="#2563eb" font-weight="600">feature-a</text>
  <text x="532" y="384" font-size="12.5" fill="#5c6672">refactor continues</text>

  <rect x="720" y="308" width="184" height="96" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="740" y="336" font-size="14" font-weight="700" fill="#1f2937">📁 ~/proj-hotfix</text>
  <text x="740" y="360" font-size="12.5" fill="#2563eb" font-weight="600">hotfix</text>
  <text x="740" y="384" font-size="12.5" fill="#5c6672">urgent fix</text>

  <text x="528" y="440" font-size="13.5" fill="#1d4ed8">✅ Both stay put, so no stash is needed</text>
  <text x="528" y="466" font-size="13.5" fill="#1d4ed8">✅ Each builds and tests on its own</text>
  <text x="528" y="492" font-size="13.5" fill="#1d4ed8">✅ Commit history stays shared</text>

  <text x="480" y="546" text-anchor="middle" font-size="14" fill="#5c6672">The cost: files really are duplicated — <tspan font-weight="700" fill="#1f2937">another copy of disk and node_modules</tspan>.</text>
</svg>

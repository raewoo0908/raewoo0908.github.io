<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 606" width="960" height="606" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <filter id="lifeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="606" fill="#ffffff"/>

  <text x="480" y="50" text-anchor="middle" font-size="29" font-weight="800" fill="#1a1a1a">The life of one worktree</text>
  <text x="480" y="82" text-anchor="middle" font-size="16" fill="#5c6672">Who does what at each stage — the badge on the right names the actor</text>

  <!-- Vertical timeline -->
  <line x1="64" y1="126" x2="64" y2="536" stroke="#e2e8f0" stroke-width="3"/>

  <!-- 1. Created -->
  <rect x="100" y="110" width="828" height="78" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" filter="url(#lifeShadow)"/>
  <circle cx="64" cy="149" r="20" fill="#7c3aed"/>
  <text x="64" y="155" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">1</text>
  <text x="124" y="142" font-size="16" font-weight="700" fill="#1f2937">It gets created</text>
  <text x="256" y="142" font-size="14" font-weight="700" fill="#6d28d9">claude -w feature-login</text>
  <text x="124" y="168" font-size="13.5" fill="#4b5563">A directory at .claude/worktrees/feature-login/, a worktree-feature-login branch, forked from the remote default branch</text>
  <rect x="828" y="130" width="86" height="26" rx="13" fill="#7c3aed"/>
  <text x="871" y="148" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Claude</text>

  <!-- 2. Filled in -->
  <rect x="100" y="196" width="828" height="78" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" filter="url(#lifeShadow)"/>
  <circle cx="64" cy="235" r="20" fill="#7c3aed"/>
  <text x="64" y="241" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">2</text>
  <text x="124" y="228" font-size="16" font-weight="700" fill="#1f2937">It gets filled in</text>
  <text x="256" y="228" font-size="14" font-weight="700" fill="#6d28d9">.worktreeinclude · git worktree lock</text>
  <text x="124" y="254" font-size="13.5" fill="#4b5563">Tracked files are checked out, the .env files you listed are copied, and a lock holds while the session is attached</text>
  <rect x="828" y="216" width="86" height="26" rx="13" fill="#7c3aed"/>
  <text x="871" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Claude</text>

  <!-- 3. Work happens -->
  <rect x="100" y="282" width="828" height="78" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1" filter="url(#lifeShadow)"/>
  <circle cx="64" cy="321" r="20" fill="#dc2626"/>
  <text x="64" y="327" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">3</text>
  <text x="124" y="314" font-size="16" font-weight="700" fill="#1f2937">Work happens — a wall goes up</text>
  <text x="124" y="340" font-size="13.5" fill="#4b5563">Edits, working directories and git redirects aimed at the main checkout are blocked at the tool layer (subagents too)</text>
  <rect x="828" y="302" width="86" height="26" rx="13" fill="#dc2626"/>
  <text x="871" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Claude</text>

  <!-- 4. Called again -->
  <rect x="100" y="368" width="828" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" filter="url(#lifeShadow)"/>
  <circle cx="64" cy="407" r="20" fill="#2563eb"/>
  <text x="64" y="413" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">4</text>
  <text x="124" y="400" font-size="16" font-weight="700" fill="#1f2937">You call the name again</text>
  <text x="322" y="400" font-size="14" font-weight="700" fill="#1d4ed8">claude -w feature-login</text>
  <text x="124" y="426" font-size="13.5" fill="#4b5563">If work is left behind it reopens untouched; if it is completely clean it resets to the latest default branch</text>
  <rect x="828" y="388" width="86" height="26" rx="13" fill="#2563eb"/>
  <text x="871" y="406" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Claude</text>

  <!-- 5. You leave -->
  <rect x="100" y="454" width="828" height="78" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1" filter="url(#lifeShadow)"/>
  <circle cx="64" cy="493" r="20" fill="#d97706"/>
  <text x="64" y="499" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">5</text>
  <text x="124" y="486" font-size="16" font-weight="700" fill="#1f2937">You leave</text>
  <text x="234" y="486" font-size="14" font-weight="700" fill="#b45309">interactive asks, -p never does</text>
  <text x="124" y="512" font-size="13.5" fill="#4b5563">Clean ones are removed and leftover work is confirmed. A worktree made with -p stays, lock and all, so clean it up yourself</text>
  <rect x="828" y="474" width="86" height="26" rx="13" fill="#475569"/>
  <text x="871" y="492" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">You / git</text>

  <!-- Bottom note -->
  <rect x="32" y="552" width="896" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="577" text-anchor="middle" font-size="14" fill="#334155">At any stage you can inspect and clean up yourself with <tspan font-weight="700" fill="#1f2937">git worktree list · remove</tspan></text>
</svg>

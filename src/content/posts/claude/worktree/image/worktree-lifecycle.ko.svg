<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 606" width="960" height="606" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <defs>
    <filter id="lifeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="606" fill="#ffffff"/>

  <text x="480" y="50" text-anchor="middle" font-size="29" font-weight="800" fill="#1a1a1a">워크트리 하나의 일생</text>
  <text x="480" y="82" text-anchor="middle" font-size="16" fill="#5c6672">각 단계에서 누가 무엇을 하는지 — 오른쪽 배지가 주체입니다</text>

  <!-- 세로 타임라인 -->
  <line x1="64" y1="126" x2="64" y2="536" stroke="#e2e8f0" stroke-width="3"/>

  <!-- 1. 생성 -->
  <rect x="100" y="110" width="828" height="78" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" filter="url(#lifeShadow)"/>
  <circle cx="64" cy="149" r="20" fill="#7c3aed"/>
  <text x="64" y="155" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">1</text>
  <text x="124" y="142" font-size="16" font-weight="700" fill="#1f2937">만들어진다</text>
  <text x="230" y="142" font-size="14" font-weight="700" fill="#6d28d9">claude -w feature-login</text>
  <text x="124" y="168" font-size="13.5" fill="#4b5563">.claude/worktrees/feature-login/ 에 디렉터리, worktree-feature-login 브랜치, 원격 기본 브랜치에서 분기</text>
  <rect x="828" y="130" width="86" height="26" rx="13" fill="#7c3aed"/>
  <text x="871" y="148" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Claude</text>

  <!-- 2. 채워진다 -->
  <rect x="100" y="196" width="828" height="78" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" filter="url(#lifeShadow)"/>
  <circle cx="64" cy="235" r="20" fill="#7c3aed"/>
  <text x="64" y="241" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">2</text>
  <text x="124" y="228" font-size="16" font-weight="700" fill="#1f2937">채워진다</text>
  <text x="230" y="228" font-size="14" font-weight="700" fill="#6d28d9">.worktreeinclude · git worktree lock</text>
  <text x="124" y="254" font-size="13.5" fill="#4b5563">추적 파일이 체크아웃되고, 적어둔 .env 가 복사되고, 세션이 붙어 있는 동안 잠금이 걸립니다</text>
  <rect x="828" y="216" width="86" height="26" rx="13" fill="#7c3aed"/>
  <text x="871" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Claude</text>

  <!-- 3. 작업한다 -->
  <rect x="100" y="282" width="828" height="78" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1" filter="url(#lifeShadow)"/>
  <circle cx="64" cy="321" r="20" fill="#dc2626"/>
  <text x="64" y="327" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">3</text>
  <text x="124" y="314" font-size="16" font-weight="700" fill="#1f2937">작업한다 — 민감작업 차단</text>
  <text x="124" y="340" font-size="13.5" fill="#4b5563">메인 체크아웃으로 향하는 편집 · 작업 디렉터리 · git 우회를 도구 계층에서 차단합니다 (서브에이전트도 동일)</text>
  <rect x="828" y="302" width="86" height="26" rx="13" fill="#dc2626"/>
  <text x="871" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Claude</text>

  <!-- 4. 다시 부른다 -->
  <rect x="100" y="368" width="828" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" filter="url(#lifeShadow)"/>
  <circle cx="64" cy="407" r="20" fill="#2563eb"/>
  <text x="64" y="413" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">4</text>
  <text x="124" y="400" font-size="16" font-weight="700" fill="#1f2937">다시 부른다</text>
  <text x="252" y="400" font-size="14" font-weight="700" fill="#1d4ed8">claude -w feature-login</text>
  <text x="124" y="426" font-size="13.5" fill="#4b5563">작업이 남아 있으면 그대로 열리고, 완전히 깨끗하면 기본 브랜치 최신 커밋에서 다시 시작됩니다</text>
  <rect x="828" y="388" width="86" height="26" rx="13" fill="#2563eb"/>
  <text x="871" y="406" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Claude</text>

  <!-- 5. 나간다 -->
  <rect x="100" y="454" width="828" height="78" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1" filter="url(#lifeShadow)"/>
  <circle cx="64" cy="493" r="20" fill="#d97706"/>
  <text x="64" y="499" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">5</text>
  <text x="124" y="486" font-size="16" font-weight="700" fill="#1f2937">나간다</text>
  <text x="206" y="486" font-size="14" font-weight="700" fill="#b45309">대화형은 물어보고, -p 는 묻지 않는다</text>
  <text x="124" y="512" font-size="13.5" fill="#4b5563">깨끗하면 지우고, 작업이 남았으면 확인합니다. -p 헤드리스 모드로 만든 워크트리는 lock 째로 남으니 직접 치워야 합니다</text>
  <rect x="828" y="474" width="86" height="26" rx="13" fill="#475569"/>
  <text x="871" y="492" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">나 / git</text>

  <!-- 바닥 메모 -->
  <rect x="32" y="552" width="896" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="577" text-anchor="middle" font-size="14" fill="#334155">어느 단계에서든 <tspan font-weight="700" fill="#1f2937">git worktree list · remove</tspan> 로 직접 들여다보고 치울 수 있습니다</text>
</svg>

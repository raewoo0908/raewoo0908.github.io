<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <defs>
    <filter id="wrapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="wrapArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <text x="480" y="50" text-anchor="middle" font-size="29" font-weight="800" fill="#1a1a1a">껍데기는 생각보다 얇습니다</text>
  <text x="480" y="82" text-anchor="middle" font-size="16" fill="#5c6672">Claude 가 더한 것은 기술이 아니라, 매번 정해야 했던 것들의 기본값입니다</text>

  <!-- ============ 위층: Claude 껍데기 ============ -->
  <rect x="32" y="110" width="896" height="212" rx="14" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" filter="url(#wrapShadow)"/>
  <path d="M32,162 L32,124 Q32,110 46,110 L914,110 Q928,110 928,124 L928,162 Z" fill="#7c3aed"/>
  <text x="52" y="143" font-size="16.5" font-weight="700" fill="#ffffff">🧅 Claude Code 껍데기 — claude -w feature-login</text>

  <rect x="54" y="182" width="272" height="56" rx="9" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="70" y="205" font-size="14" font-weight="700" fill="#5b21b6">어디에 만들지</text>
  <text x="70" y="226" font-size="13" fill="#4b5563">.claude/worktrees/&lt;이름&gt;/ 로 고정</text>

  <rect x="344" y="182" width="272" height="56" rx="9" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="360" y="205" font-size="14" font-weight="700" fill="#5b21b6">브랜치 이름</text>
  <text x="360" y="226" font-size="13" fill="#4b5563">worktree-&lt;이름&gt; 으로 고정</text>

  <rect x="634" y="182" width="272" height="56" rx="9" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="650" y="205" font-size="14" font-weight="700" fill="#5b21b6">어느 커밋에서 시작</text>
  <text x="650" y="226" font-size="13" fill="#4b5563">원격의 기본 브랜치 (baseRef)</text>

  <rect x="54" y="250" width="272" height="56" rx="9" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="70" y="273" font-size="14" font-weight="700" fill="#5b21b6">.env 같은 미추적 파일</text>
  <text x="70" y="294" font-size="13" fill="#4b5563">.worktreeinclude 로 자동 복사</text>

  <rect x="344" y="250" width="272" height="56" rx="9" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="360" y="273" font-size="14" font-weight="700" fill="#5b21b6">세션의 위치</text>
  <text x="360" y="294" font-size="13" fill="#4b5563">그 자리에서 시작하고 재개도 복귀</text>

  <rect x="634" y="250" width="272" height="56" rx="9" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="650" y="273" font-size="14" font-weight="700" fill="#5b21b6">다 쓰고 치우기</text>
  <text x="650" y="294" font-size="13" fill="#4b5563">나갈 때 물어보고, 주기적으로 청소</text>

  <!-- ============ 화살표 ============ -->
  <line x1="480" y1="330" x2="480" y2="374" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#wrapArrow)"/>
  <text x="500" y="360" font-size="13.5" fill="#6d28d9">결국 실행하는 것은</text>

  <!-- ============ 아래층: git ============ -->
  <rect x="32" y="386" width="896" height="112" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#wrapShadow)"/>
  <path d="M32,438 L32,400 Q32,386 46,386 L914,386 Q928,386 928,400 L928,438 Z" fill="#334155"/>
  <text x="52" y="419" font-size="16.5" font-weight="700" fill="#ffffff">🌳 git worktree add — 진짜 일은 여기서 벌어집니다</text>
  <text x="52" y="470" font-size="14.5" fill="#334155">워킹 트리 · HEAD · index 는 따로, objects 와 refs 는 공유 — <tspan font-weight="700" fill="#1f2937">git worktree list 에 그대로 뜨는 평범한 워크트리</tspan></text>

  <text x="480" y="530" text-anchor="middle" font-size="13.5" fill="#64748b">Claude 를 지워도 워크트리는 남고, git worktree remove 로 지우면 그만입니다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="610" fill="#ffffff"/>

  <text x="480" y="52" text-anchor="middle" font-size="30" font-weight="800" fill="#1a1a1a">branch · worktree · claude worktree</text>
  <text x="480" y="84" text-anchor="middle" font-size="16" fill="#5c6672">Not rivals but layers — a label, then a desk, then a desk your session moves to</text>

  <!-- ===== Layer 1: git branch ===== -->
  <rect x="32" y="118" width="896" height="128" rx="14" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1" filter="url(#cardShadow)"/>
  <path d="M252,118 L46,118 Q32,118 32,132 L32,232 Q32,246 46,246 L252,246 Z" fill="#059669"/>
  <text x="56" y="170" font-size="26">🏷️</text>
  <text x="94" y="168" font-size="20" font-weight="700" fill="#ffffff">git branch</text>
  <text x="56" y="206" font-size="13.5" fill="#ffffff" fill-opacity="0.92">A label</text>
  <text x="284" y="168" font-size="17.5" font-weight="700" fill="#1f2937">One pointer at one commit</text>
  <text x="284" y="200" font-size="14.5" fill="#5c6672">One working directory — switching swaps that one wholesale</text>
  <text x="284" y="226" font-size="13.5" fill="#059669" font-weight="600">Branches open at once: 1</text>

  <!-- ===== Layer 2: git worktree ===== -->
  <rect x="32" y="266" width="896" height="128" rx="14" fill="#eff6ff" stroke="#dbeafe" stroke-width="1" filter="url(#cardShadow)"/>
  <path d="M252,266 L46,266 Q32,266 32,280 L32,380 Q32,394 46,394 L252,394 Z" fill="#2563eb"/>
  <text x="56" y="318" font-size="26">🪑</text>
  <text x="94" y="316" font-size="20" font-weight="700" fill="#ffffff">git worktree</text>
  <text x="56" y="354" font-size="13.5" fill="#ffffff" fill-opacity="0.92">One more desk</text>
  <text x="284" y="316" font-size="17.5" font-weight="700" fill="#1f2937">N working directories sharing one .git</text>
  <text x="284" y="348" font-size="14.5" fill="#5c6672">You lay branches out side by side instead of swapping them</text>
  <text x="284" y="374" font-size="13.5" fill="#2563eb" font-weight="600">Branches open at once: N</text>

  <!-- ===== Layer 3: claude worktree ===== -->
  <rect x="32" y="414" width="896" height="128" rx="14" fill="#f5f3ff" stroke="#ede9fe" stroke-width="1" filter="url(#cardShadow)"/>
  <path d="M252,414 L46,414 Q32,414 32,428 L32,528 Q32,542 46,542 L252,542 Z" fill="#7c3aed"/>
  <text x="56" y="466" font-size="26">🤖</text>
  <text x="94" y="464" font-size="20" font-weight="700" fill="#ffffff">claude worktree</text>
  <text x="56" y="502" font-size="13.5" fill="#ffffff" fill-opacity="0.92">Desk + session move</text>
  <text x="284" y="464" font-size="17.5" font-weight="700" fill="#1f2937">Creates a git worktree and moves the session into it</text>
  <text x="284" y="496" font-size="14.5" fill="#5c6672">cwd, CLAUDE.md and settings follow; it even offers to clean up</text>
  <text x="284" y="522" font-size="13.5" fill="#7c3aed" font-weight="600">Underneath it is just a git worktree — what differs is who manages it</text>

  <text x="480" y="580" text-anchor="middle" font-size="14.5" fill="#5c6672">Each layer wraps the one above. A worktree <tspan font-weight="700" fill="#1f2937">does not replace</tspan> branches — it adds room to lay them out.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="610" fill="#ffffff"/>

  <text x="480" y="52" text-anchor="middle" font-size="30" font-weight="800" fill="#1a1a1a">branch · worktree · claude worktree</text>
  <text x="480" y="84" text-anchor="middle" font-size="16" fill="#5c6672">셋은 경쟁 관계가 아니라 층입니다 — 이름표 → 책상 → 책상 + 세션 이동</text>

  <!-- ===== Layer 1: git branch ===== -->
  <rect x="32" y="118" width="896" height="128" rx="14" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1" filter="url(#cardShadow)"/>
  <path d="M252,118 L46,118 Q32,118 32,132 L32,232 Q32,246 46,246 L252,246 Z" fill="#059669"/>
  <text x="56" y="170" font-size="26">🏷️</text>
  <text x="94" y="168" font-size="20" font-weight="700" fill="#ffffff">git branch</text>
  <text x="56" y="206" font-size="13.5" fill="#ffffff" fill-opacity="0.92">이름표</text>
  <text x="284" y="168" font-size="17.5" font-weight="700" fill="#1f2937">커밋을 가리키는 포인터 하나</text>
  <text x="284" y="200" font-size="14.5" fill="#5c6672">작업 디렉터리는 1개 — switch 하면 그 하나가 통째로 바뀝니다</text>
  <text x="284" y="226" font-size="13.5" fill="#059669" font-weight="600">동시에 펼칠 수 있는 브랜치: 1개</text>

  <!-- ===== Layer 2: git worktree ===== -->
  <rect x="32" y="266" width="896" height="128" rx="14" fill="#eff6ff" stroke="#dbeafe" stroke-width="1" filter="url(#cardShadow)"/>
  <path d="M252,266 L46,266 Q32,266 32,280 L32,380 Q32,394 46,394 L252,394 Z" fill="#2563eb"/>
  <text x="56" y="318" font-size="26">🪑</text>
  <text x="94" y="316" font-size="20" font-weight="700" fill="#ffffff">git worktree</text>
  <text x="56" y="354" font-size="13.5" fill="#ffffff" fill-opacity="0.92">책상 하나 더</text>
  <text x="284" y="316" font-size="17.5" font-weight="700" fill="#1f2937">같은 .git 을 공유하는 작업 디렉터리 N 개</text>
  <text x="284" y="348" font-size="14.5" fill="#5c6672">브랜치를 갈아끼우는 게 아니라 나란히 펼쳐 둡니다</text>
  <text x="284" y="374" font-size="13.5" fill="#2563eb" font-weight="600">동시에 펼칠 수 있는 브랜치: N 개</text>

  <!-- ===== Layer 3: claude worktree ===== -->
  <rect x="32" y="414" width="896" height="128" rx="14" fill="#f5f3ff" stroke="#ede9fe" stroke-width="1" filter="url(#cardShadow)"/>
  <path d="M252,414 L46,414 Q32,414 32,428 L32,528 Q32,542 46,542 L252,542 Z" fill="#7c3aed"/>
  <text x="56" y="466" font-size="26">🤖</text>
  <text x="94" y="464" font-size="20" font-weight="700" fill="#ffffff">claude worktree</text>
  <text x="56" y="502" font-size="13.5" fill="#ffffff" fill-opacity="0.92">책상 + 세션 이동</text>
  <text x="284" y="464" font-size="17.5" font-weight="700" fill="#1f2937">git worktree 를 만들고 세션을 그리로 옮깁니다</text>
  <text x="284" y="496" font-size="14.5" fill="#5c6672">cwd · CLAUDE.md · 설정이 따라가고, 끝날 때 정리까지 물어봅니다</text>
  <text x="284" y="522" font-size="13.5" fill="#7c3aed" font-weight="600">실체는 그냥 git worktree — 다른 건 누가 관리하느냐</text>

  <text x="480" y="580" text-anchor="middle" font-size="14.5" fill="#5c6672">아래 층은 위 층을 감쌉니다. 워크트리는 브랜치를 <tspan font-weight="700" fill="#1f2937">대체하지 않고</tspan>, 브랜치를 펼쳐 둘 자리를 늘립니다.</text>
</svg>

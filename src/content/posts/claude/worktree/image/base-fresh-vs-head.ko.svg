<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 522" width="960" height="522" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <defs>
    <filter id="baseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <marker id="baseArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="freshArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="headArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="522" fill="#ffffff"/>

  <text x="480" y="50" text-anchor="middle" font-size="29" font-weight="800" fill="#1a1a1a">새 워크트리는 어디서 갈라지나</text>
  <text x="480" y="82" text-anchor="middle" font-size="16" fill="#5c6672">기본값은 내 로컬이 아니라 원격입니다 — 이게 손으로 만들 때와 가장 다른 점입니다</text>

  <!-- 커밋 체인 -->
  <line x1="238" y1="190" x2="408" y2="190" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#baseArrow)"/>
  <line x1="488" y1="190" x2="658" y2="190" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#baseArrow)"/>
  <text x="573" y="176" text-anchor="middle" font-size="12.5" fill="#b45309">아직 푸시 안 함</text>

  <circle cx="200" cy="190" r="34" fill="#334155"/>
  <text x="200" y="196" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">d994492</text>

  <circle cx="450" cy="190" r="34" fill="#059669"/>
  <text x="450" y="196" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">5857051</text>
  <rect x="386" y="118" width="128" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="450" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">origin/main</text>

  <circle cx="700" cy="190" r="34" fill="#d97706"/>
  <text x="700" y="196" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">b4639d6</text>
  <rect x="628" y="118" width="144" height="28" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="700" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">로컬 main · HEAD</text>

  <!-- 분기선 -->
  <line x1="450" y1="228" x2="450" y2="302" stroke="#059669" stroke-width="2.5" marker-end="url(#freshArrow)"/>
  <text x="462" y="268" font-size="13.5" font-weight="700" fill="#047857">"fresh" (기본값)</text>

  <line x1="700" y1="228" x2="700" y2="302" stroke="#d97706" stroke-width="2.5" marker-end="url(#headArrow)"/>
  <text x="712" y="268" font-size="13.5" font-weight="700" fill="#b45309">"head"</text>

  <!-- 결과 카드 -->
  <rect x="310" y="310" width="280" height="112" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" filter="url(#baseShadow)"/>
  <text x="330" y="340" font-size="15" font-weight="700" fill="#065f46">워크트리 A</text>
  <text x="330" y="366" font-size="13" fill="#1f2937">시작 커밋: 5857051</text>
  <text x="330" y="390" font-size="13" fill="#1f2937">src: bye.js · index.js</text>
  <text x="330" y="412" font-size="12.5" fill="#047857">→ 내 미푸시 커밋은 안 보인다</text>

  <rect x="610" y="310" width="280" height="112" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1" filter="url(#baseShadow)"/>
  <text x="630" y="340" font-size="15" font-weight="700" fill="#92400e">워크트리 B</text>
  <text x="630" y="366" font-size="13" fill="#1f2937">시작 커밋: b4639d6</text>
  <text x="630" y="390" font-size="13" fill="#1f2937">src: bye.js · index.js · later.js</text>
  <text x="630" y="412" font-size="12.5" fill="#b45309">→ 하던 작업을 그대로 물려받는다</text>

  <!-- 바닥 메모 -->
  <rect x="32" y="446" width="896" height="46" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="475" text-anchor="middle" font-size="14" fill="#334155"><tspan font-weight="700" fill="#1f2937">worktree.baseRef</tspan> 에는 "fresh" 와 "head" 두 값만 들어갑니다. 브랜치 이름은 넣을 수 없습니다.</text>
</svg>

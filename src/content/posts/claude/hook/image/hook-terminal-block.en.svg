<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="360" fill="#ffffff"/>

  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">This is what happens when you try to end the turn without en.md</text>

  <!-- terminal window -->
  <rect x="24" y="46" width="912" height="252" rx="12" fill="#0f172a"/>
  <path d="M24 58 a12 12 0 0 1 12 -12 h888 a12 12 0 0 1 12 12 v22 h-912 z" fill="#1e293b"/>
  <circle cx="48" cy="66" r="6" fill="#ef4444"/>
  <circle cx="70" cy="66" r="6" fill="#f59e0b"/>
  <circle cx="92" cy="66" r="6" fill="#22c55e"/>
  <text x="480" y="71" text-anchor="middle" font-size="12" fill="#94a3b8">zsh — GithubBlog</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">
    <text x="48" y="112" fill="#e2e8f0"><tspan fill="#22c55e">$ </tspan>node scripts/check-bilingual.mjs --worktree</text>

    <text x="48" y="148" fill="#f87171">✗ ko/en pair out of sync — edit both files together:</text>
    <text x="64" y="172" fill="#cbd5e1">- src/content/posts/claude/hook/ : ko.md changed but en.md did not</text>
    <text x="97" y="196" fill="#fbbf24">→ update src/content/posts/claude/hook/en.md to match</text>

    <text x="48" y="232" fill="#e2e8f0"><tspan fill="#22c55e">$ </tspan>echo $?</text>
    <text x="48" y="256" fill="#f87171" font-weight="700">2</text>
  </g>

  <!-- caption -->
  <rect x="24" y="310" width="912" height="38" rx="10" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1"/>
  <text x="44" y="334" font-size="12.5" fill="#334155">The Stop hook sees that <tspan font-weight="700" fill="#b45309">exit code 2</tspan> and refuses to end the turn, handing the stderr above straight to Claude.</text>
</svg>

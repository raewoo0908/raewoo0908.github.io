<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" width="960" height="592" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="592" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">📖 훅 이벤트 31종 지도</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#5c6672">세션이 흘러가는 순서대로 묶었습니다. ● 표시는 종료코드 2로 막을 수 있는 이벤트입니다</text>

  <!-- 타임라인 -->
  <line x1="46" y1="86" x2="906" y2="86" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="90" cy="86" r="5" fill="#d97706"/>
  <text x="90" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#a16207">세션 시작</text>
  <circle cx="300" cy="86" r="5" fill="#d97706"/>
  <text x="300" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#a16207">프롬프트</text>
  <circle cx="510" cy="86" r="5" fill="#d97706"/>
  <text x="510" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#a16207">도구 루프</text>
  <circle cx="700" cy="86" r="5" fill="#d97706"/>
  <text x="700" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#a16207">턴 종료</text>
  <circle cx="870" cy="86" r="5" fill="#d97706"/>
  <text x="870" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#a16207">세션 종료</text>

  <!-- 카드 1 -->
  <rect x="34" y="126" width="288" height="218" rx="12" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1"/>
  <text x="54" y="152" font-size="14" font-weight="700" fill="#a16207">세션 수명 · 8</text>
  <g font-size="12.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="54" y="177">SessionStart</text>
    <text x="54" y="199">Setup</text>
    <text x="54" y="221">InstructionsLoaded</text>
    <text x="54" y="243">ConfigChange <tspan fill="#dc2626">●</tspan></text>
    <text x="54" y="265">CwdChanged</text>
    <text x="54" y="287">DirectoryAdded</text>
    <text x="54" y="309">FileChanged</text>
    <text x="54" y="331">SessionEnd</text>
  </g>

  <!-- 카드 2 -->
  <rect x="336" y="126" width="288" height="218" rx="12" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1"/>
  <text x="356" y="152" font-size="14" font-weight="700" fill="#a16207">프롬프트 · 표시 · 3</text>
  <g font-size="12.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="356" y="177">UserPromptSubmit <tspan fill="#dc2626">●</tspan></text>
    <text x="356" y="199">UserPromptExpansion <tspan fill="#dc2626">●</tspan></text>
    <text x="356" y="221">MessageDisplay</text>
  </g>
  <text x="356" y="255" font-size="11.5" fill="#7c8794">앞의 둘과 SessionStart — 이 셋만</text>
  <text x="356" y="273" font-size="11.5" fill="#7c8794">stdout이 Claude에게 그대로 갑니다</text>

  <!-- 카드 3 -->
  <rect x="638" y="126" width="288" height="218" rx="12" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1"/>
  <text x="658" y="152" font-size="14" font-weight="700" fill="#a16207">도구 · 6</text>
  <g font-size="12.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="658" y="177">PreToolUse <tspan fill="#dc2626">●</tspan></text>
    <text x="658" y="199">PermissionRequest <tspan fill="#dc2626">●</tspan></text>
    <text x="658" y="221">PermissionDenied</text>
    <text x="658" y="243">PostToolUse</text>
    <text x="658" y="265">PostToolUseFailure</text>
    <text x="658" y="287">PostToolBatch <tspan fill="#dc2626">●</tspan></text>
  </g>

  <!-- 카드 4 -->
  <rect x="34" y="358" width="288" height="196" rx="12" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1"/>
  <text x="54" y="384" font-size="14" font-weight="700" fill="#a16207">서브에이전트 · 태스크 · 5</text>
  <g font-size="12.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="54" y="409">SubagentStart</text>
    <text x="54" y="431">SubagentStop <tspan fill="#dc2626">●</tspan></text>
    <text x="54" y="453">TaskCreated</text>
    <text x="54" y="475">TaskCompleted</text>
    <text x="54" y="497">TeammateIdle</text>
  </g>

  <!-- 카드 5 -->
  <rect x="336" y="358" width="288" height="196" rx="12" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1"/>
  <text x="356" y="384" font-size="14" font-weight="700" fill="#a16207">턴 종료 · 알림 · 3</text>
  <g font-size="12.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="356" y="409">Stop <tspan fill="#dc2626">●</tspan></text>
    <text x="356" y="431">StopFailure</text>
    <text x="356" y="453">Notification</text>
  </g>
  <text x="356" y="487" font-size="11.5" fill="#7c8794">Stop 을 막을 때는 stop_hook_active</text>
  <text x="356" y="505" font-size="11.5" fill="#7c8794">확인이 필수입니다 (무한 루프 방지)</text>

  <!-- 카드 6 -->
  <rect x="638" y="358" width="288" height="196" rx="12" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1"/>
  <text x="658" y="384" font-size="14" font-weight="700" fill="#a16207">컨텍스트 · 워크트리 · MCP · 6</text>
  <g font-size="12.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="658" y="409">PreCompact <tspan fill="#dc2626">●</tspan></text>
    <text x="658" y="431">PostCompact</text>
    <text x="658" y="453">WorktreeCreate <tspan fill="#dc2626">●</tspan></text>
    <text x="658" y="475">WorktreeRemove</text>
    <text x="658" y="497">Elicitation</text>
    <text x="658" y="519">ElicitationResult</text>
  </g>

  <text x="34" y="578" font-size="11.5" fill="#7c8794">실제로 손대는 건 대개 PreToolUse · PostToolUse · Stop · Notification 네 개입니다. 나머지는 필요해질 때 찾아 쓰면 됩니다.</text>
</svg>

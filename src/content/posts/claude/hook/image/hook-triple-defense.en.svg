<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">🛡️ Three layers — if one misses, the next one catches</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#5c6672">Why editing ko.md and forgetting en.md can never reach the repository</text>

  <!-- start -->
  <rect x="28" y="150" width="140" height="76" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="98" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Violation</text>
  <text x="98" y="202" text-anchor="middle" font-size="12" fill="#7f1d1d">only ko.md edited</text>

  <line x1="172" y1="188" x2="216" y2="188" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- layer 1: PostToolUse -->
  <rect x="220" y="118" width="200" height="140" rx="12" fill="#fffbeb" stroke="#e2cf9a" stroke-width="1.5"/>
  <rect x="220" y="118" width="200" height="34" rx="12" fill="#d97706"/>
  <rect x="220" y="140" width="200" height="12" fill="#d97706"/>
  <text x="320" y="141" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">1st · PostToolUse</text>
  <text x="320" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#a16207">the moment you edit</text>
  <text x="320" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Nudges, doesn't block</text>
  <text x="320" y="222" text-anchor="middle" font-size="11.5" fill="#5c6672">a word via additionalContext</text>
  <rect x="272" y="232" width="96" height="20" rx="6" fill="#dcfce7"/>
  <text x="320" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">exit code 0</text>

  <line x1="424" y1="188" x2="462" y2="188" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="443" y="180" text-anchor="middle" font-size="10.5" fill="#7c8794">ignored</text>

  <!-- layer 2: Stop -->
  <rect x="466" y="118" width="200" height="140" rx="12" fill="#fffbeb" stroke="#e2cf9a" stroke-width="1.5"/>
  <rect x="466" y="118" width="200" height="34" rx="12" fill="#d97706"/>
  <rect x="466" y="140" width="200" height="12" fill="#d97706"/>
  <text x="566" y="141" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">2nd · Stop</text>
  <text x="566" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#a16207">as the turn tries to end</text>
  <text x="566" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Refuses to let it end</text>
  <text x="566" y="222" text-anchor="middle" font-size="11.5" fill="#5c6672">stderr is handed to Claude</text>
  <rect x="518" y="232" width="96" height="20" rx="6" fill="#fee2e2"/>
  <text x="566" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">exit code 2</text>

  <line x1="670" y1="188" x2="708" y2="188" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="689" y="180" text-anchor="middle" font-size="10.5" fill="#7c8794">still</text>

  <!-- layer 3: pre-commit -->
  <rect x="712" y="118" width="200" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="712" y="118" width="200" height="34" rx="12" fill="#475569"/>
  <rect x="712" y="140" width="200" height="12" fill="#475569"/>
  <text x="812" y="141" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">3rd · git pre-commit</text>
  <text x="812" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">as you try to commit</text>
  <text x="812" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Rejects the commit</text>
  <text x="812" y="222" text-anchor="middle" font-size="11.5" fill="#5c6672">holds even outside Claude</text>
  <rect x="764" y="232" width="96" height="20" rx="6" fill="#fee2e2"/>
  <text x="812" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">exit code 1</text>

  <!-- footer -->
  <rect x="28" y="296" width="884" height="86" rx="12" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1"/>
  <text x="52" y="324" font-size="13" font-weight="700" fill="#a16207">Why three</text>
  <text x="52" y="348" font-size="12.5" fill="#334155">The first is <tspan font-weight="600">soft</tspan> — it never interrupts the work, it just says "fix it now".</text>
  <text x="52" y="368" font-size="12.5" fill="#334155">The second is <tspan font-weight="600">hard</tspan> — it enforces the rule inside the session. The third is the <tspan font-weight="600">last resort</tspan> — it stops a human committing by hand.</text>
</svg>

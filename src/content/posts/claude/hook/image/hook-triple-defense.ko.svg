<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">🛡️ 3중 방어 — 한 번 놓쳐도 다음이 잡습니다</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#5c6672">ko.md 만 고치고 en.md 를 빼먹었을 때, 이 규칙이 저장소까지 새어 나가지 못하는 이유</text>

  <!-- 출발 -->
  <rect x="28" y="150" width="140" height="76" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="98" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">위반 발생</text>
  <text x="98" y="202" text-anchor="middle" font-size="12" fill="#7f1d1d">ko.md 만 수정</text>

  <line x1="172" y1="188" x2="216" y2="188" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 1차: PostToolUse -->
  <rect x="220" y="118" width="200" height="140" rx="12" fill="#fffbeb" stroke="#e2cf9a" stroke-width="1.5"/>
  <rect x="220" y="118" width="200" height="34" rx="12" fill="#d97706"/>
  <rect x="220" y="140" width="200" height="12" fill="#d97706"/>
  <text x="320" y="141" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">1차 · PostToolUse</text>
  <text x="320" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#a16207">편집한 그 순간</text>
  <text x="320" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">막지 않고 알려줍니다</text>
  <text x="320" y="222" text-anchor="middle" font-size="11.5" fill="#5c6672">additionalContext 로 귀띔</text>
  <rect x="272" y="232" width="96" height="20" rx="6" fill="#dcfce7"/>
  <text x="320" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">종료코드 0</text>

  <line x1="424" y1="188" x2="462" y2="188" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="443" y="180" text-anchor="middle" font-size="10.5" fill="#7c8794">무시하면</text>

  <!-- 2차: Stop -->
  <rect x="466" y="118" width="200" height="140" rx="12" fill="#fffbeb" stroke="#e2cf9a" stroke-width="1.5"/>
  <rect x="466" y="118" width="200" height="34" rx="12" fill="#d97706"/>
  <rect x="466" y="140" width="200" height="12" fill="#d97706"/>
  <text x="566" y="141" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">2차 · Stop</text>
  <text x="566" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#a16207">턴을 끝내려 할 때</text>
  <text x="566" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">아예 못 끝내게 합니다</text>
  <text x="566" y="222" text-anchor="middle" font-size="11.5" fill="#5c6672">stderr 가 Claude 에게 전달</text>
  <rect x="518" y="232" width="96" height="20" rx="6" fill="#fee2e2"/>
  <text x="566" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">종료코드 2</text>

  <line x1="670" y1="188" x2="708" y2="188" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="689" y="180" text-anchor="middle" font-size="10.5" fill="#7c8794">그래도</text>

  <!-- 3차: pre-commit -->
  <rect x="712" y="118" width="200" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="712" y="118" width="200" height="34" rx="12" fill="#475569"/>
  <rect x="712" y="140" width="200" height="12" fill="#475569"/>
  <text x="812" y="141" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">3차 · git pre-commit</text>
  <text x="812" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">커밋하려 할 때</text>
  <text x="812" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">커밋을 거부합니다</text>
  <text x="812" y="222" text-anchor="middle" font-size="11.5" fill="#5c6672">Claude 밖에서도 통하는 방어</text>
  <rect x="764" y="232" width="96" height="20" rx="6" fill="#fee2e2"/>
  <text x="812" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">종료코드 1</text>

  <!-- 하단 요약 -->
  <rect x="28" y="296" width="884" height="86" rx="12" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1"/>
  <text x="52" y="324" font-size="13" font-weight="700" fill="#a16207">왜 세 겹인가</text>
  <text x="52" y="348" font-size="12.5" fill="#334155">1차는 <tspan font-weight="600">부드럽게</tspan> — 작업 흐름을 끊지 않고 지금 고치라고 알려만 줍니다.</text>
  <text x="52" y="368" font-size="12.5" fill="#334155">2차는 <tspan font-weight="600">단단하게</tspan> — 세션 안에서 규칙을 강제합니다. 3차는 <tspan font-weight="600">최후로</tspan> — 사람이 직접 커밋해도 막힙니다.</text>
</svg>

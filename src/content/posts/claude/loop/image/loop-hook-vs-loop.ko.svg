<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="390" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">⚡ Hook vs 🔁 /loop — 무엇이 방아쇠인가</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#5c6672">둘 다 로컬 세션에서 돌지만, ‘언제 실행되는가’가 다릅니다</text>

  <!-- 왼쪽: Hook (앰버) -->
  <rect x="40" y="76" width="430" height="250" rx="12" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1"/>
  <text x="62" y="106" font-size="15" font-weight="700" fill="#a16207">⚡ Hook — 이벤트 기반</text>
  <text x="62" y="126" font-size="11.5" fill="#7c8794">무언가 일어나는 바로 그 순간</text>

  <!-- 불규칙한 이벤트 스파이크 -->
  <line x1="70" y1="172" x2="440" y2="172" stroke="#e2cf9a" stroke-width="1.5"/>
  <g stroke="#d97706" stroke-width="1.6">
    <line x1="102" y1="172" x2="102" y2="156"/>
    <line x1="150" y1="172" x2="150" y2="156"/>
    <line x1="244" y1="172" x2="244" y2="156"/>
    <line x1="268" y1="172" x2="268" y2="156"/>
    <line x1="360" y1="172" x2="360" y2="156"/>
    <line x1="418" y1="172" x2="418" y2="156"/>
  </g>
  <g fill="#d97706">
    <circle cx="102" cy="153" r="3.5"/><circle cx="150" cy="153" r="3.5"/>
    <circle cx="244" cy="153" r="3.5"/><circle cx="268" cy="153" r="3.5"/>
    <circle cx="360" cy="153" r="3.5"/><circle cx="418" cy="153" r="3.5"/>
  </g>
  <text x="126" y="145" text-anchor="middle" font-size="9.5" fill="#a16207">Edit</text>
  <text x="256" y="145" text-anchor="middle" font-size="9.5" fill="#a16207">Bash</text>
  <text x="418" y="145" text-anchor="middle" font-size="9.5" fill="#a16207">Stop</text>
  <text x="255" y="190" text-anchor="middle" font-size="10" fill="#7c8794">불규칙 · 이벤트가 터질 때만</text>

  <text x="62" y="222" font-size="12.5" fill="#334155">도구를 부르거나 턴이 끝나는 순간,</text>
  <text x="62" y="240" font-size="12.5" fill="#334155">밀리초 단위로 끼어듭니다.</text>
  <line x1="62" y1="258" x2="448" y2="258" stroke="#f0e4c4" stroke-width="1"/>
  <text x="62" y="280" font-size="11" fill="#7c8794">이럴 때</text>
  <text x="62" y="301" font-size="12.5" font-weight="700" fill="#1f2937">저장할 때마다 포맷 · 위험 명령 차단</text>

  <!-- 오른쪽: /loop (블루) -->
  <rect x="490" y="76" width="430" height="250" rx="12" fill="#eff6ff" stroke="#d3e2fb" stroke-width="1"/>
  <text x="512" y="106" font-size="15" font-weight="700" fill="#1d4ed8">🔁 /loop — 시간 기반</text>
  <text x="512" y="126" font-size="11.5" fill="#7c8794">내가 다른 일 하는 동안 주기적으로</text>

  <!-- 규칙적인 틱 -->
  <line x1="520" y1="172" x2="890" y2="172" stroke="#bcd4fb" stroke-width="1.5"/>
  <g fill="#2563eb">
    <circle cx="542" cy="172" r="4"/><circle cx="602" cy="172" r="4"/>
    <circle cx="662" cy="172" r="4"/><circle cx="722" cy="172" r="4"/>
    <circle cx="782" cy="172" r="4"/><circle cx="842" cy="172" r="4"/>
  </g>
  <text x="572" y="150" text-anchor="middle" font-size="9.5" fill="#1d4ed8">5m</text>
  <text x="632" y="150" text-anchor="middle" font-size="9.5" fill="#1d4ed8">5m</text>
  <text x="692" y="150" text-anchor="middle" font-size="9.5" fill="#1d4ed8">5m</text>
  <text x="705" y="190" text-anchor="middle" font-size="10" fill="#7c8794">규칙적 · 일정 간격마다</text>

  <text x="512" y="222" font-size="12.5" fill="#334155">정해진 간격마다(또는 Claude가 정한</text>
  <text x="512" y="240" font-size="12.5" fill="#334155">간격마다) 프롬프트를 다시 실행합니다.</text>
  <line x1="512" y1="258" x2="898" y2="258" stroke="#d9e6fb" stroke-width="1"/>
  <text x="512" y="280" font-size="11" fill="#7c8794">이럴 때</text>
  <text x="512" y="301" font-size="12.5" font-weight="700" fill="#1f2937">5분마다 배포 확인 · PR 베이비시팅</text>

  <!-- 요약 밴드 -->
  <rect x="40" y="342" width="880" height="34" rx="10" fill="#f8fafc" stroke="#e5e8ec" stroke-width="1"/>
  <text x="480" y="364" text-anchor="middle" font-size="13" fill="#334155">한줄 요약 — 이벤트에 <tspan font-weight="700" fill="#a16207">반응</tspan>하면 Hook, 시간에 맞춰 <tspan font-weight="700" fill="#2563eb">반복</tspan>하면 /loop</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arW" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">⏰ 실전 — 매주 월요일, 아무도 없을 때 도는 점검</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#5c6672">이 블로그가 실제로 걸어둔 routine 하나의 한살이입니다</text>

  <!-- ① 트리거 -->
  <rect x="40" y="100" width="190" height="200" rx="12" fill="#f5f3ff" stroke="#e2dbfb" stroke-width="1"/>
  <text x="60" y="138" font-size="20">⏰</text>
  <text x="60" y="168" font-size="13.5" font-weight="700" fill="#6d28d9">① 트리거</text>
  <text x="60" y="196" font-size="11.5" fill="#334155">매주 월요일 09:00</text>
  <text x="60" y="218" font-size="11.5" fill="#334155">한국 시간 기준으로</text>
  <rect x="60" y="232" width="150" height="26" rx="6" fill="#ffffff" stroke="#e2dbfb" stroke-width="1"/>
  <text x="70" y="250" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6d28d9">0 0 * * 1</text>
  <text x="60" y="280" font-size="11" fill="#7c8794">UTC 로 적습니다</text>

  <line x1="230" y1="200" x2="270" y2="200" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arW)"/>

  <!-- ② 클라우드 세션 -->
  <rect x="270" y="100" width="190" height="200" rx="12" fill="#f5f3ff" stroke="#e2dbfb" stroke-width="1"/>
  <text x="290" y="138" font-size="20">☁️</text>
  <text x="290" y="168" font-size="13.5" font-weight="700" fill="#6d28d9">② 클라우드 세션</text>
  <text x="290" y="196" font-size="11.5" fill="#334155">저장소를 새로 클론</text>
  <text x="290" y="218" font-size="11.5" fill="#334155">승인 창 없이 자율 실행</text>
  <text x="290" y="240" font-size="11.5" fill="#334155">격리된 샌드박스</text>
  <text x="290" y="280" font-size="11" fill="#7c8794">내 컴퓨터는 꺼져 있어도</text>

  <line x1="460" y1="200" x2="500" y2="200" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arW)"/>

  <!-- ③ 점검 -->
  <rect x="500" y="100" width="190" height="200" rx="12" fill="#f5f3ff" stroke="#e2dbfb" stroke-width="1"/>
  <text x="520" y="138" font-size="20">🔍</text>
  <text x="520" y="168" font-size="13.5" font-weight="700" fill="#6d28d9">③ 점검</text>
  <text x="520" y="196" font-size="11.5" fill="#334155">ko/en 짝 전부 대조</text>
  <text x="520" y="218" font-size="11.5" fill="#334155">어색한 표현 찾기</text>
  <text x="520" y="240" font-size="11.5" fill="#334155">공식 문서와 사실 확인</text>
  <text x="520" y="280" font-size="11" fill="#7c8794">code.claude.com 은 기본 허용</text>

  <line x1="690" y1="200" x2="730" y2="200" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arW)"/>

  <!-- ④ 결과 -->
  <rect x="730" y="100" width="190" height="200" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="750" y="138" font-size="20">📤</text>
  <text x="750" y="168" font-size="13.5" font-weight="700" fill="#6d28d9">④ 결과</text>
  <text x="750" y="196" font-size="11.5" fill="#334155">리포트를 생성, 커밋해서</text>
  <text x="750" y="218" font-size="11.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">claude/…</text>
  <text x="750" y="240" font-size="11.5" fill="#334155">브랜치로 push</text>
  <text x="750" y="280" font-size="11" fill="#7c8794">📨 Discord 로 요약 전송</text>

  <!-- 하단 배너 -->
  <rect x="40" y="322" width="880" height="48" rx="10" fill="#f8fafc" stroke="#e5e8ec" stroke-width="1"/>
  <text x="480" y="351" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">사람이 하는 일은 월요일 아침에 <tspan font-weight="800" fill="#6d28d9">올라온 브랜치를 열어보는 것</tspan> 하나뿐입니다</text>

  <text x="40" y="392" font-size="11.5" fill="#7c8794">기본 설정에서 Claude 는 claude/ 로 시작하는 브랜치에만 push 할 수 있습니다 — main 은 실수로도 건드리지 못합니다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">🧭 셋을 어떻게 겹치나 — 시리즈 마무리</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#5c6672">경쟁하는 도구가 아닙니다. 서로 다른 시간대를 나눠 맡습니다</text>

  <!-- 열 제목 -->
  <text x="306" y="84" font-size="11" font-weight="600" fill="#7c8794">언제 켜지나</text>
  <text x="478" y="84" font-size="11" font-weight="600" fill="#7c8794">어디서 도나</text>
  <text x="638" y="84" font-size="11" font-weight="600" fill="#7c8794">이 블로그에선</text>

  <!-- ⚡ Hook -->
  <rect x="40" y="94" width="880" height="84" rx="12" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1"/>
  <text x="66" y="134" font-size="22">⚡</text>
  <text x="100" y="126" font-size="15" font-weight="800" fill="#a16207">Hook</text>
  <text x="100" y="148" font-size="11.5" fill="#7c8794">이벤트가 터질 때마다</text>
  <line x1="290" y1="110" x2="290" y2="162" stroke="#f3e6c8" stroke-width="1"/>
  <text x="306" y="142" font-size="12.5" fill="#334155">도구 호출 · 턴 종료</text>
  <line x1="462" y1="110" x2="462" y2="162" stroke="#f3e6c8" stroke-width="1"/>
  <text x="478" y="142" font-size="12.5" fill="#334155">로컬 세션</text>
  <line x1="622" y1="110" x2="622" y2="162" stroke="#f3e6c8" stroke-width="1"/>
  <text x="638" y="142" font-size="12.5" font-weight="600" fill="#a16207">ko/en 짝이 어긋나면 턴을 막습니다</text>

  <!-- 🔁 /loop -->
  <rect x="40" y="190" width="880" height="84" rx="12" fill="#eff6ff" stroke="#dbeafe" stroke-width="1"/>
  <text x="66" y="230" font-size="22">🔁</text>
  <text x="100" y="222" font-size="15" font-weight="800" fill="#1d4ed8">/loop</text>
  <text x="100" y="244" font-size="11.5" fill="#7c8794">내가 작업하는 동안</text>
  <line x1="290" y1="206" x2="290" y2="258" stroke="#dbeafe" stroke-width="1"/>
  <text x="306" y="238" font-size="12.5" fill="#334155">몇 분~몇 시간 간격</text>
  <line x1="462" y1="206" x2="462" y2="258" stroke="#dbeafe" stroke-width="1"/>
  <text x="478" y="238" font-size="12.5" fill="#334155">로컬 세션</text>
  <line x1="622" y1="206" x2="622" y2="258" stroke="#dbeafe" stroke-width="1"/>
  <text x="638" y="238" font-size="12.5" font-weight="600" fill="#1d4ed8">배포가 끝났는지 지켜봅니다</text>

  <!-- ☁️ /routine -->
  <rect x="40" y="286" width="880" height="84" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="66" y="326" font-size="22">☁️</text>
  <text x="100" y="318" font-size="15" font-weight="800" fill="#6d28d9">/routine</text>
  <text x="100" y="340" font-size="11.5" fill="#7c8794">내가 자리에 없어도</text>
  <line x1="290" y1="302" x2="290" y2="354" stroke="#e2dbfb" stroke-width="1"/>
  <text x="306" y="334" font-size="12.5" fill="#334155">cron · API · GitHub</text>
  <line x1="462" y1="302" x2="462" y2="354" stroke="#e2dbfb" stroke-width="1"/>
  <text x="478" y="334" font-size="12.5" font-weight="700" fill="#6d28d9">Anthropic 클라우드</text>
  <line x1="622" y1="302" x2="622" y2="354" stroke="#e2dbfb" stroke-width="1"/>
  <text x="638" y="334" font-size="12.5" font-weight="600" fill="#6d28d9">매주 월요일 문서를 점검합니다</text>

  <!-- 하단 -->
  <rect x="40" y="392" width="880" height="60" rx="12" fill="#f8fafc" stroke="#e5e8ec" stroke-width="1"/>
  <text x="480" y="418" text-anchor="middle" font-size="14" font-weight="800" fill="#1f2937">이벤트마다 → Hook · 작업 중 → /loop · 자리에 없어도 → /routine</text>
  <text x="480" y="440" text-anchor="middle" font-size="12" fill="#7c8794">같은 규칙이라도 겹쳐 걸 수 있습니다 — 훅으로 막고, 루프로 지켜보고, routine 으로 주기 점검합니다</text>
</svg>

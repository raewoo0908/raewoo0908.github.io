<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="960" height="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="310" fill="#ffffff"/>

  <text x="480" y="30" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">⚡ Hook Execution Flow</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#5c6672">Steps into session events to enforce your rules</text>

  <text x="32" y="120" font-size="12" fill="#a16207">Local session — while the session is alive</text>
  <rect x="30" y="125" width="900" height="90" rx="14" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1"/>

  <rect x="48" y="148" width="130" height="44" rx="10" fill="#ffffff" stroke="#e2cf9a" stroke-width="1"/>
  <text x="113" y="175" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">User message</text>

  <rect x="400" y="148" width="120" height="44" rx="10" fill="#ffffff" stroke="#e2cf9a" stroke-width="1"/>
  <text x="460" y="175" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Tool runs</text>

  <rect x="740" y="148" width="140" height="44" rx="10" fill="#ffffff" stroke="#e2cf9a" stroke-width="1"/>
  <text x="810" y="175" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Turn ends</text>

  <line x1="182" y1="170" x2="396" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="524" y1="170" x2="736" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="214" y="70" width="150" height="42" rx="10" fill="#d97706"/>
  <text x="289" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">PreToolUse</text>
  <text x="289" y="104" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.92">validate · block risky cmd</text>
  <line x1="289" y1="112" x2="289" y2="146" stroke="#d97706" stroke-width="2" marker-end="url(#arAmber)"/>

  <rect x="555" y="70" width="150" height="42" rx="10" fill="#d97706"/>
  <text x="630" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">PostToolUse</text>
  <text x="630" y="104" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.92">lint · format · test</text>
  <line x1="630" y1="112" x2="630" y2="146" stroke="#d97706" stroke-width="2" marker-end="url(#arAmber)"/>

  <rect x="735" y="70" width="150" height="42" rx="10" fill="#d97706"/>
  <text x="810" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Stop</text>
  <text x="810" y="104" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.92">report · save · notify</text>
  <line x1="810" y1="112" x2="810" y2="146" stroke="#d97706" stroke-width="2" marker-end="url(#arAmber)"/>

  <line x1="289" y1="215" x2="289" y2="247" stroke="#dc2626" stroke-width="2" marker-end="url(#arRed)"/>
  <rect x="139" y="250" width="300" height="42" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="289" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b91c1c">Blocked → exit code 2 → feedback to Claude</text>
</svg>

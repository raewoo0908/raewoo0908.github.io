  <rect x="644" y="118" width="282" height="442" rx="14" fill="#f5f3ff" stroke="#e2dbfb" stroke-width="1" filter="url(#cardShadow)"/>
  <path d="M644,184 L644,132 Q644,118 658,118 L912,118 Q926,118 926,132 L926,184 Z" fill="#7c3aed"/>

  <text x="52" y="516" font-size="14" font-weight="600" fill="#1f2937">lint · format · 차단 · 알림</text>

  <!-- ===================== Card 1: /loop ===================== -->
  <rect x="338" y="118" width="282" height="442" rx="14" fill="#eff6ff" stroke="#d3e2fb" stroke-width="1" filter="url(#cardShadow)"/>
  <path d="M338,184 L338,132 Q338,118 352,118 L606,118 Q620,118 620,132 L620,184 Z" fill="#2563eb"/>

  <text x="480" y="84" text-anchor="middle" font-size="16" fill="#5c6672">이벤트 → 세션 → 클라우드 · 시간 단위가 다르면 쓰는 자리도 다릅니다</text>

  <!-- ===================== Card 0: Hook ===================== -->
  <rect x="32" y="118" width="282" height="442" rx="14" fill="#fffbeb" stroke="#f3e6c8" stroke-width="1" filter="url(#cardShadow)"/>
  <path d="M32,184 L32,132 Q32,118 46,118 L300,118 Q314,118 314,132 L314,184 Z" fill="#d97706"/>

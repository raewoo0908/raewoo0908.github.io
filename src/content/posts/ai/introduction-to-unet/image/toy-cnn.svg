  <g fill="none" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#head)">
    <path d="M164 190H212"/>
    <path d="M414 190H462"/>
    <path d="M518 238V290H156V326"/>
    <path d="M292 345H340"/>

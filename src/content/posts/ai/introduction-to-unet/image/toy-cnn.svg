    <!-- 3×3 커널 2개 -->
    <g transform="translate(262 20)"><rect width="66" height="66" fill="#fff" stroke="none"/><rect width="66" height="66" fill="url(#g22)" stroke="none"/><rect width="66" height="66" rx="3" stroke-width="2.5"/></g>
    <g transform="translate(280 38)"><rect width="66" height="66" fill="#fff" stroke="none"/><rect width="66" height="66" fill="url(#g22)" stroke="none"/><rect width="66" height="66" rx="3" stroke-width="2.5"/></g>
    <!-- conv -->
    <rect x="214" y="128" width="200" height="124" rx="62"/>
    <!-- 출력 2×2×2 -->
    <g transform="translate(464 150)"><rect width="68" height="68" fill="#fff" stroke="none"/><rect width="68" height="68" fill="url(#g34)" stroke="none"/><rect width="68" height="68" rx="4"/></g>
    <g transform="translate(484 170)"><rect width="68" height="68" fill="#fff" stroke="none"/><rect width="68" height="68" fill="url(#g34)" stroke="none"/><rect width="68" height="68" rx="4"/></g>
    <!-- flatten 1×8 -->
    <g transform="translate(20 328)"><rect width="272" height="34" fill="url(#g34)" stroke="none"/><rect width="272" height="34" rx="4"/></g>
    <rect x="342" y="300" width="190" height="90" rx="45"/>

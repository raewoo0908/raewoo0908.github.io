<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 952" width="740" height="952" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="740" height="952" fill="#ffffff"/>
  <line x1="40" y1="95" x2="40" y2="719" stroke="#c7d2fe" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="40" cy="95" r="6" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <circle cx="40" cy="349" r="6" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <circle cx="40" cy="525" r="6" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <circle cx="40" cy="719" r="6" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="370" y="34" text-anchor="middle" font-size="21" font-weight="800" fill="#1a1a1a">📜 역대 분류 알고리즘의 계보</text>
  <text x="370" y="56" text-anchor="middle" font-size="12.5" fill="#5c6672">로지스틱 회귀는 1958년, 이 흐름의 한가운데에서 태어났습니다</text>
  <text x="62" y="100" font-size="15" font-weight="700" fill="#4338ca">통계적 분류의 태동</text>
  <text x="62" y="118" font-size="11.5" font-style="italic" fill="#6366f1">1936년 – 1958년</text>
  <circle cx="74" cy="136" r="2.6" fill="#6366f1"/>
  <text font-size="12.5" fill="#3f4652"><tspan x="90" y="140"><tspan font-weight="700" fill="#312e81">1936년, LDA (선형 판별 분석): </tspan><tspan>로널드 피셔가 제안. 클래스 간 분산은 최대화하고 클래스 내 분산은</tspan></tspan><tspan x="90" dy="18"><tspan>최소화하는 축을 찾는 통계적 방법.</tspan></tspan></text>
  <circle cx="74" cy="184" r="2.6" fill="#6366f1"/>
  <text font-size="12.5" fill="#3f4652"><tspan x="90" y="188"><tspan font-weight="700" fill="#312e81">1951년, KNN (K-Nearest Neighbors): </tspan><tspan>픽스와 호지스가 제안. 복잡한 수식 없이 가장 가까운 이웃</tspan></tspan><tspan x="90" dy="18"><tspan>데이터를 기반으로 분류하는 비모수적 방법.</tspan></tspan></text>
  <circle cx="74" cy="232" r="2.6" fill="#6366f1"/>
  <text font-size="12.5" fill="#3f4652"><tspan x="90" y="236"><tspan font-weight="700" fill="#312e81">1957년, 퍼셉트론 (Perceptron): </tspan><tspan>프랭크 로젠블랫이 개발한 최초의 인공 신경망 모델. 단순 선형</tspan></tspan><tspan x="90" dy="18"><tspan>분류만 가능하여 XOR 문제를 풀지 못해 한계에 부딪힘.</tspan></tspan></text>
  <circle cx="74" cy="280" r="2.6" fill="#6366f1"/>
  <text font-size="12.5" fill="#3f4652"><tspan x="90" y="284"><tspan font-weight="700" fill="#312e81">1958년, 로지스틱 회귀 (Logistic Regression): </tspan><tspan>확률(우도)을 기반으로 수학적으로 엄밀하게 클래스</tspan></tspan><tspan x="90" dy="18"><tspan>소속 확률을 계산하는 이론 정립.</tspan></tspan></text>
  <text x="62" y="354" font-size="15" font-weight="700" fill="#4338ca">규칙 기반 학습과 비선형성의 극복</text>
  <text x="62" y="372" font-size="11.5" font-style="italic" fill="#6366f1">1970년대 – 1980년대</text>
  <circle cx="74" cy="390" r="2.6" fill="#6366f1"/>
  <text font-size="12.5" fill="#3f4652"><tspan x="90" y="394"><tspan font-weight="700" fill="#312e81">1979년/1984년, 결정 트리 (ID3 &amp; CART): </tspan><tspan>데이터를 분할할 때 불순도(엔트로피, 지니 계수)가 가장</tspan></tspan><tspan x="90" dy="18"><tspan>크게 감소하는 규칙을 찾는 알고리즘. 인간이 이해하기 쉬운 IF-THEN 규칙을 도출하여 실무에 널리</tspan></tspan><tspan x="90" dy="18"><tspan>쓰이기 시작함.</tspan></tspan></text>
  <circle cx="74" cy="456" r="2.6" fill="#6366f1"/>
  <text font-size="12.5" fill="#3f4652"><tspan x="90" y="460"><tspan font-weight="700" fill="#312e81">1986년, 다층 퍼셉트론과 역전파 (MLP &amp; Backpropagation): </tspan><tspan>은닉층(Hidden Layer)과 역전파</tspan></tspan><tspan x="90" dy="18"><tspan>알고리즘의 도입으로 퍼셉트론의 선형 분류 한계를 극복하고 비선형 결정 경계를 학습하기 시작함.</tspan></tspan></text>
  <text x="62" y="530" font-size="15" font-weight="700" fill="#4338ca">수학적 최적화와 앙상블의 시대</text>
  <text x="62" y="548" font-size="11.5" font-style="italic" fill="#6366f1">1990년대</text>
  <circle cx="74" cy="566" r="2.6" fill="#6366f1"/>
  <text font-size="12.5" fill="#3f4652"><tspan x="90" y="570"><tspan font-weight="700" fill="#312e81">1995년, SVM (Support Vector Machine): </tspan><tspan>블라디미르 바프닉이 제안. '마진(Margin) 최대화'와 '커널</tspan></tspan><tspan x="90" dy="18"><tspan>트릭(Kernel Trick)'을 도입하여 고차원 데이터의 비선형 분류에서 신경망을 압도하는 성능을 보여줌.</tspan></tspan><tspan x="90" dy="18"><tspan>2000년대 초반까지 머신러닝의 제왕으로 군림함.</tspan></tspan></text>
  <circle cx="74" cy="632" r="2.6" fill="#6366f1"/>
  <text font-size="12.5" fill="#3f4652"><tspan x="90" y="636"><tspan font-weight="700" fill="#312e81">1995년 ~ 2001년, 랜덤 포레스트 (Random Forest): </tspan><tspan>단일 결정 트리의 고질적인 문제인</tspan></tspan><tspan x="90" dy="18"><tspan>과적합(Overfitting)을 막기 위해, 수많은 트리를 독립적으로 만들어 다수결을 투표하는 배깅(Bagging)</tspan></tspan><tspan x="90" dy="18"><tspan>앙상블 기법이 정립됨.</tspan></tspan></text>
  <text x="62" y="724" font-size="15" font-weight="700" fill="#4338ca">부스팅(Boosting)의 진화와 딥러닝 르네상스</text>
  <text x="62" y="742" font-size="11.5" font-style="italic" fill="#6366f1">2000년대 – 2010년대</text>
  <circle cx="74" cy="760" r="2.6" fill="#6366f1"/>
  <text font-size="12.5" fill="#3f4652"><tspan x="90" y="764"><tspan font-weight="700" fill="#312e81">2001년, GBM (Gradient Boosting Machine): </tspan><tspan>제롬 프리드먼 제안. 이전 트리의 '오차(Gradient)'를</tspan></tspan><tspan x="90" dy="18"><tspan>다음 트리가 순차적으로 보완해 나가는 부스팅 기법 정립.</tspan></tspan></text>
  <circle cx="74" cy="808" r="2.6" fill="#6366f1"/>
  <text font-size="12.5" fill="#3f4652"><tspan x="90" y="812"><tspan font-weight="700" fill="#312e81">2012년, CNN과 딥러닝 시대의 개막: </tspan><tspan>AlexNet이 이미지 분류 대회(ILSVRC)에서 기존 알고리즘들을</tspan></tspan><tspan x="90" dy="18"><tspan>압도하며 비정형 데이터(이미지, 텍스트, 음성) 분류의 패러다임을 딥러닝으로 완전히 전환함.</tspan></tspan></text>
  <circle cx="74" cy="856" r="2.6" fill="#6366f1"/>
  <text font-size="12.5" fill="#3f4652"><tspan x="90" y="860"><tspan font-weight="700" fill="#312e81">2014년 ~ 2017년, 부스팅 3대장 (XGBoost, LightGBM, CatBoost): </tspan><tspan>GBM의 연산 속도와 과적합 문제를</tspan></tspan><tspan x="90" dy="18"><tspan>극한으로 최적화한 알고리즘들 등장. 현재까지도 표(Tabular) 형태의 정형 데이터 분류 대회(Kaggle</tspan></tspan><tspan x="90" dy="18"><tspan>등)를 휩쓰는 실무 표준(State-of-the-Art)입니다.</tspan></tspan></text>
</svg>

  <text x="396.0" y="368" text-anchor="middle" font-size="11" fill="#5c6672">0</text>
  <text x="472.0" y="368" text-anchor="middle" font-size="11" fill="#5c6672">2</text>
  <text x="548.0" y="368" text-anchor="middle" font-size="11" fill="#5c6672">4</text>
  <text x="624.0" y="368" text-anchor="middle" font-size="11" fill="#5c6672">6</text>
  <text x="700.0" y="368" text-anchor="middle" font-size="11" fill="#5c6672">8</text>
  <text x="82" y="352.0" text-anchor="end" font-size="11" fill="#5c6672">0.0</text>
  <text x="82" y="215.0" text-anchor="end" font-size="11" fill="#5c6672">0.5</text>
  <text x="82" y="78.0" text-anchor="end" font-size="11" fill="#5c6672">1.0</text>


  <line x1="92" y1="211" x2="700" y2="211" stroke="#c7d2fe" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="92" y1="74" x2="700" y2="74" stroke="#a5b4fc" stroke-width="1" stroke-dasharray="0"/>

  <!-- 축 -->
  <line x1="396" y1="66" x2="396" y2="356" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="92" y1="348" x2="700" y2="348" stroke="#94a3b8" stroke-width="1.5"/>


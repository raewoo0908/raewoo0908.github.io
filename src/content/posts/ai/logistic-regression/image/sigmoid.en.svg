<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" width="740" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="740" height="430" fill="#ffffff"/>

  <text x="370" y="32" text-anchor="middle" font-size="21" font-weight="800" fill="#1a1a1a">📈 The Sigmoid Function</text>
  <text x="370" y="54" text-anchor="middle" font-size="12.5" fill="#5c6672">It turns the linear combination z into “the probability of belonging to class 1”</text>

  <!-- 0과 1 사이 띠 — '여기를 절대 벗어나지 않는다'를 보이게 -->
  <rect x="92" y="74" width="608" height="274" fill="#eef2ff"/>


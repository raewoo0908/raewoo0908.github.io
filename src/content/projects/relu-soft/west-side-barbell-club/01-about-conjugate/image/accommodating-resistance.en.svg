<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">⛓️ Bands and chains — tension across the whole range</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">With a bare barbell, a weight that fits the bottom is light at the top, and a weight that fits the top is a miss at the bottom</text>

  <!-- axes -->
  <line x1="100" y1="330" x2="620" y2="330" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="100" y1="96" x2="100" y2="330" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="92" y="102" text-anchor="end" font-size="11.5" fill="#7c8794">Force</text>
  <text x="106" y="350" font-size="11" fill="#7c8794">Bottom (weakest point)</text>
  <text x="620" y="350" text-anchor="end" font-size="11" fill="#7c8794">Lockout (strongest point)</text>

  <!-- shaded shortfall -->
  <path d="M100,296 C240,282 380,210 620,142 L620,296 Z" fill="#f1f5f9"/>

  <!-- strength curve -->
  <path d="M100,296 C240,282 380,210 620,142" fill="none" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- bar + AR -->
  <path d="M100,296 C240,274 380,214 620,160" fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- bar only -->
  <line x1="100" y1="296" x2="620" y2="296" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- shaded-region note -->
  <text x="466" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#64748b">Resistance to spare here</text>
  <text x="466" y="266" text-anchor="middle" font-size="11" fill="#94a3b8">No reason left to accelerate</text>

  <!-- legend -->
  <line x1="118" y1="112" x2="150" y2="112" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="160" y="116" font-size="11.5" font-weight="700" fill="#64748b">Strength curve — force you can produce</text>

  <line x1="118" y1="140" x2="150" y2="140" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="160" y="144" font-size="11.5" font-weight="700" fill="#1d4ed8">Bar only — identical resistance start to finish</text>

  <line x1="118" y1="168" x2="150" y2="168" stroke="#dc2626" stroke-width="3"/>
  <text x="160" y="172" font-size="11.5" font-weight="700" fill="#b91c1c">Bar + bands / chains — resistance climbs with the curve</text>

  <!-- right panel -->
  <rect x="676" y="96" width="244" height="234" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="698" y="126" font-size="12.5" font-weight="800" fill="#b91c1c">Tested ratios (18-month study)</text>
  <line x1="698" y1="138" x2="898" y2="138" stroke="#fecaca" stroke-width="1"/>

  <text x="698" y="164" font-size="11" fill="#334155">Explosive strength (30–40%)</text>
  <text x="898" y="164" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c">25%</text>

  <text x="698" y="196" font-size="11" fill="#334155">Speed-strength (75–85%)</text>
  <text x="898" y="196" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c">Chain 25%</text>
  <text x="898" y="214" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c">Band 25–33%</text>

  <text x="698" y="246" font-size="11" fill="#334155">Strength-speed (90%+)</text>
  <text x="898" y="246" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c">50%</text>

  <text x="698" y="278" font-size="11" fill="#334155">Circa-max (3 weeks out)</text>
  <text x="898" y="278" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c">Band 38–47%</text>

  <line x1="698" y1="294" x2="898" y2="294" stroke="#fecaca" stroke-width="1"/>
  <text x="698" y="316" font-size="10.5" fill="#7c8794">Chains only add resistance; bands also overspeed the eccentric</text>

  <rect x="40" y="366" width="880" height="46" rx="10" fill="#f8fafc" stroke="#e5e8ec" stroke-width="1"/>
  <text x="480" y="394" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Which is why a DE-day "percentage" is two numbers: <tspan font-weight="800" fill="#b91c1c">bar 50–60% + AR 25% = total load 75–85%</tspan></text>
</svg>

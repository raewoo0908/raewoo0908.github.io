<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">⛓️ 밴드와 체인 — 전 가동범위에 장력을 만든다</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">바벨만으로는 "아래에 맞추면 위가 가볍고, 위에 맞추면 아래에서 미스"가 납니다</text>

  <!-- 축 -->
  <line x1="100" y1="330" x2="620" y2="330" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="100" y1="96" x2="100" y2="330" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="92" y="102" text-anchor="end" font-size="11.5" fill="#7c8794">힘</text>
  <text x="106" y="350" font-size="11" fill="#7c8794">바닥 (가장 약한 지점)</text>
  <text x="620" y="350" text-anchor="end" font-size="11" fill="#7c8794">락아웃 (가장 강한 지점)</text>

  <!-- 부족 구간 음영 -->
  <path d="M100,296 C240,282 380,210 620,142 L620,296 Z" fill="#f1f5f9"/>

  <!-- 근력 곡선 -->
  <path d="M100,296 C240,282 380,210 620,142" fill="none" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- 바 + 밴드/체인 -->
  <path d="M100,296 C240,274 380,214 620,160" fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- 바벨만 -->
  <line x1="100" y1="296" x2="620" y2="296" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- 음영 구간 주석 -->
  <text x="466" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#64748b">저항이 남아도는 구간</text>
  <text x="466" y="266" text-anchor="middle" font-size="11" fill="#94a3b8">가속할 이유가 사라짐</text>

  <!-- 범례 -->
  <line x1="118" y1="112" x2="150" y2="112" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="160" y="116" font-size="11.5" font-weight="700" fill="#64748b">근력 곡선 — 낼 수 있는 힘</text>

  <line x1="118" y1="140" x2="150" y2="140" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="160" y="144" font-size="11.5" font-weight="700" fill="#1d4ed8">바벨만 — 저항이 처음부터 끝까지 똑같다</text>

  <line x1="118" y1="168" x2="150" y2="168" stroke="#dc2626" stroke-width="3"/>
  <text x="160" y="172" font-size="11.5" font-weight="700" fill="#b91c1c">바 + 밴드 / 체인 — 근력 곡선을 따라 저항도 오른다</text>

  <!-- 오른쪽 배합비 패널 -->
  <rect x="676" y="96" width="244" height="234" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="698" y="126" font-size="12.5" font-weight="800" fill="#b91c1c">검증된 배합비 (18개월 실험)</text>
  <line x1="698" y1="138" x2="898" y2="138" stroke="#fecaca" stroke-width="1"/>

  <text x="698" y="164" font-size="11" fill="#334155">폭발적 근력 (30~40%)</text>
  <text x="898" y="164" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c">25%</text>

  <text x="698" y="196" font-size="11" fill="#334155">스피드-스트렝스 (75~85%)</text>
  <text x="898" y="196" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c">체인 25%</text>
  <text x="898" y="214" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c">밴드 25~33%</text>

  <text x="698" y="246" font-size="11" fill="#334155">스트렝스-스피드 (90%+)</text>
  <text x="898" y="246" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c">50%</text>

  <text x="698" y="278" font-size="11" fill="#334155">Circa-Max (시합 3주 전)</text>
  <text x="898" y="278" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c">밴드 38~47%</text>

  <line x1="698" y1="294" x2="898" y2="294" stroke="#fecaca" stroke-width="1"/>
  <text x="698" y="316" font-size="10.5" fill="#7c8794">체인은 저항만, 밴드는 오버스피드 이센트릭까지</text>

  <!-- 하단 배너 -->
  <rect x="40" y="366" width="880" height="46" rx="10" fill="#f8fafc" stroke="#e5e8ec" stroke-width="1"/>
  <text x="480" y="394" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">그래서 DE 데이의 "퍼센트"는 <tspan font-weight="800" fill="#b91c1c">바 중량 50~60% + AR 25% = 총 부하 75~85%</tspan> 로 이중 구조입니다</text>
</svg>

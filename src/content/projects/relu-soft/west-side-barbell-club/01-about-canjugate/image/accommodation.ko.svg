<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
  <defs>
    <marker id="acArr" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">🧬 적응의 법칙 — 같은 종목은 3주면 멈춘다</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">칸쥬게이트는 중량을 낮추는 게 아니라, 매주 다른 종목으로 최대치를 칩니다</text>

  <!-- 축 -->
  <line x1="100" y1="330" x2="640" y2="330" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="100" y1="100" x2="100" y2="330" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="92" y="106" text-anchor="end" font-size="11.5" fill="#7c8794">기록</text>
  <text x="648" y="334" font-size="11.5" fill="#7c8794">주</text>

  <!-- 3주 벽 -->
  <line x1="316" y1="100" x2="316" y2="330" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="264" y="82" width="104" height="22" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="316" y="97" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">3주 벽</text>

  <!-- 같은 종목 반복 (정체) -->
  <polyline points="100,330 208,272 316,244 424,238 532,236 640,235" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="640" cy="235" r="4.5" fill="#94a3b8"/>
  <text x="440" y="268" font-size="12" font-weight="700" fill="#64748b">같은 종목 반복</text>
  <text x="440" y="286" font-size="11" fill="#94a3b8">몸이 완전히 적응 → 정체</text>

  <!-- 매주 종목 교체 -->
  <polyline points="100,330 208,268 316,222 424,186 532,150 640,118" fill="none" stroke="#dc2626" stroke-width="3"/>
  <circle cx="208" cy="268" r="4.5" fill="#dc2626"/>
  <circle cx="316" cy="222" r="4.5" fill="#dc2626"/>
  <circle cx="424" cy="186" r="4.5" fill="#dc2626"/>
  <circle cx="532" cy="150" r="4.5" fill="#dc2626"/>
  <circle cx="640" cy="118" r="4.5" fill="#dc2626"/>
  <text x="656" y="115" font-size="12" font-weight="700" fill="#b91c1c">매주 종목 교체</text>
  <text x="656" y="133" font-size="11" fill="#94a3b8">거의 적응하되 완전히는 X</text>

  <!-- 주차 라벨 = 매주 다른 종목 -->
  <text x="208" y="352" text-anchor="middle" font-size="11" fill="#7c8794">1주</text>
  <text x="316" y="352" text-anchor="middle" font-size="11" fill="#7c8794">2주</text>
  <text x="424" y="352" text-anchor="middle" font-size="11" fill="#7c8794">3주</text>
  <text x="532" y="352" text-anchor="middle" font-size="11" fill="#7c8794">4주</text>
  <text x="640" y="352" text-anchor="middle" font-size="11" fill="#7c8794">5주</text>
  <text x="208" y="370" text-anchor="middle" font-size="10.5" fill="#b91c1c">박스 스쿼트</text>
  <text x="316" y="370" text-anchor="middle" font-size="10.5" fill="#b91c1c">랙풀</text>
  <text x="424" y="370" text-anchor="middle" font-size="10.5" fill="#b91c1c">굿모닝</text>
  <text x="532" y="370" text-anchor="middle" font-size="10.5" fill="#b91c1c">스모 데드</text>
  <text x="640" y="370" text-anchor="middle" font-size="10.5" fill="#b91c1c">…</text>

  <!-- 오른쪽 인용 패널 -->
  <rect x="700" y="176" width="220" height="176" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="722" y="206" font-size="18">📖</text>
  <text x="722" y="234" font-size="12.5" font-weight="700" fill="#b91c1c">1972, 소련 Dynamo Club</text>
  <text x="722" y="258" font-size="11" fill="#334155">마스터급 역도선수 70명 · 12주</text>
  <text x="722" y="278" font-size="11" fill="#334155">클래식 리프트를 빼고</text>
  <text x="722" y="298" font-size="11" fill="#334155">특수운동 25~40종으로 대체</text>
  <text x="722" y="326" font-size="11" fill="#7c8794">실험이 끝나자 선수들이</text>
  <text x="722" y="344" font-size="11" fill="#7c8794">"종목을 더 달라"고 요청</text>

  <!-- 하단 배너 -->
  <rect x="40" y="386" width="880" height="0" fill="none"/>
  <text x="100" y="404" font-size="12.5" font-weight="600" fill="#334155">90% 이상 중량으로 <tspan font-weight="800" fill="#b91c1c">3주를 넘기면 진전이 멈춘다</tspan> — 칸쥬게이트는 이 벽을 종목 교체로 우회합니다</text>
</svg>

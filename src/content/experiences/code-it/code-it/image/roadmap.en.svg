<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="510" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1a">🗺 The 29-Week Curriculum Roadmap</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5c6672">Starts at Python, ends at a cloud deployment · Aug 4, 2026 – Feb 26, 2027</text>

  <!-- axis -->
  <text x="350" y="84" text-anchor="middle" font-size="10.5" fill="#9aa4b0">0</text>
  <text x="450" y="84" text-anchor="middle" font-size="10.5" fill="#9aa4b0">wk 5</text>
  <text x="550" y="84" text-anchor="middle" font-size="10.5" fill="#9aa4b0">wk 10</text>
  <text x="650" y="84" text-anchor="middle" font-size="10.5" fill="#9aa4b0">wk 15</text>
  <text x="750" y="84" text-anchor="middle" font-size="10.5" fill="#9aa4b0">wk 20</text>
  <text x="850" y="84" text-anchor="middle" font-size="10.5" fill="#9aa4b0">wk 25</text>
  <text x="930" y="84" text-anchor="middle" font-size="10.5" fill="#9aa4b0">wk 29</text>
  <g stroke="#eef1f4" stroke-width="1">
    <line x1="350" y1="92" x2="350" y2="372"/>
    <line x1="450" y1="92" x2="450" y2="372"/>
    <line x1="550" y1="92" x2="550" y2="372"/>
    <line x1="650" y1="92" x2="650" y2="372"/>
    <line x1="750" y1="92" x2="750" y2="372"/>
    <line x1="850" y1="92" x2="850" y2="372"/>
    <line x1="930" y1="92" x2="930" y2="372"/>
  </g>

  <!-- 1 -->
  <text x="24" y="108" font-size="13" font-weight="700" fill="#1f2937">🐍 Applied Python · Data Analysis</text>
  <text x="24" y="123" font-size="10.5" fill="#7c8794">NumPy · Pandas · Matplotlib · Seaborn</text>
  <rect x="350" y="99" width="40" height="26" rx="6" fill="#60a5fa"/>
  <text x="398" y="116" font-size="10.5" font-weight="700" fill="#2563eb">wk 0–2</text>

  <!-- 2 -->
  <text x="24" y="148" font-size="13" font-weight="700" fill="#1f2937">📊 Machine Learning</text>
  <text x="24" y="163" font-size="10.5" fill="#7c8794">scikit-learn · dimensionality reduction (PCA · LDA)</text>
  <rect x="390" y="139" width="40" height="26" rx="6" fill="#38bdf8"/>
  <text x="438" y="156" font-size="10.5" font-weight="700" fill="#0284c7">wk 2–4</text>

  <!-- 3 -->
  <text x="24" y="188" font-size="13" font-weight="700" fill="#1f2937">🔥 Deep Learning · PyTorch</text>
  <text x="24" y="203" font-size="10.5" fill="#7c8794">architecture · training optimization · advanced PyTorch</text>
  <rect x="430" y="179" width="60" height="26" rx="6" fill="#818cf8"/>
  <text x="498" y="196" font-size="10.5" font-weight="700" fill="#4f46e5">wk 4–7</text>

  <!-- 4 -->
  <text x="24" y="228" font-size="13" font-weight="700" fill="#1f2937">👁 Computer Vision</text>
  <text x="24" y="243" font-size="10.5" fill="#7c8794">classification · YOLO/SSD · segmentation · GAN · Diffusion</text>
  <rect x="490" y="219" width="120" height="26" rx="6" fill="#a78bfa"/>
  <text x="550" y="236" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">wk 7–13 (longest)</text>

  <!-- 5 -->
  <text x="24" y="268" font-size="13" font-weight="700" fill="#1f2937">💬 Natural Language Processing</text>
  <text x="24" y="283" font-size="10.5" fill="#7c8794">RNN · Seq2Seq · Attention · Transformer · BERT/GPT</text>
  <rect x="610" y="259" width="60" height="26" rx="6" fill="#f472b6"/>
  <text x="678" y="276" font-size="10.5" font-weight="700" fill="#db2777">wk 13–16</text>

  <!-- 6 -->
  <text x="24" y="308" font-size="13" font-weight="700" fill="#1f2937">🧠 LLM · RAG · Agents</text>
  <text x="24" y="323" font-size="10.5" fill="#7c8794">HuggingFace · LangChain · vector DBs · fine-tuning</text>
  <rect x="670" y="299" width="100" height="26" rx="6" fill="#fb923c"/>
  <text x="720" y="316" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">wk 16–21</text>

  <!-- 7 -->
  <text x="24" y="348" font-size="13" font-weight="700" fill="#1f2937">🚀 Optimization · Serving · Deployment</text>
  <text x="24" y="363" font-size="10.5" fill="#7c8794">Docker · ONNX/quantization · vLLM · FastAPI · GCP</text>
  <rect x="770" y="339" width="160" height="26" rx="6" fill="#34d399"/>
  <text x="850" y="356" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">wk 21–29</text>

  <!-- projects -->
  <text x="24" y="402" font-size="12" font-weight="700" fill="#7c8794">Three projects interleaved with the curriculum</text>

  <rect x="24" y="412" width="293.3" height="78" rx="12" fill="#f8fafc" stroke="#e5e8ec" stroke-width="1"/>
  <text x="42" y="438" font-size="10.5" font-weight="800" fill="#a78bfa">STEP 1 · Beginner</text>
  <text x="42" y="460" font-size="13.5" font-weight="700" fill="#1f2937">Pill recognition model</text>
  <text x="42" y="479" font-size="11" fill="#5c6672">CV fundamentals · Kaggle submission</text>

  <rect x="333.3" y="412" width="293.3" height="78" rx="12" fill="#f8fafc" stroke="#e5e8ec" stroke-width="1"/>
  <text x="351.3" y="438" font-size="10.5" font-weight="800" fill="#fb923c">STEP 2 · Intermediate</text>
  <text x="351.3" y="460" font-size="13.5" font-weight="700" fill="#1f2937">Conversational search AI</text>
  <text x="351.3" y="479" font-size="11" fill="#5c6672">retrieval tuning · cost vs. quality</text>

  <rect x="642.7" y="412" width="293.3" height="78" rx="12" fill="#f8fafc" stroke="#e5e8ec" stroke-width="1"/>
  <text x="660.7" y="438" font-size="10.5" font-weight="800" fill="#10b981">STEP 3 · Advanced</text>
  <text x="660.7" y="460" font-size="13.5" font-weight="700" fill="#1f2937">Brand ad generation AI</text>
  <text x="660.7" y="479" font-size="11" fill="#5c6672">model serving → cloud deployment</text>
</svg>
